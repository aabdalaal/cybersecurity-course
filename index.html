iv class=\"fc-en\">MITM</div><div class=\"fc-def\">وضع المهاجم نفسه بين طرفَي اتصالٍ فيقرأ حركتهما ويعدّلها.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">التشفير المتناظر/غير المتناظر</div><div class=\"fc-en\">Symmetric / Asymmetric</div><div class=\"fc-def\">مفتاحٌ سرّيٌّ واحد مقابل زوجٍ عامّ/خاصّ — أساس كلّ ضوابط التعمية.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">التدبير المضادّ</div><div class=\"fc-en\">Control</div><div class=\"fc-def\">إجراءٌ يقلّل الخطر بكسر سلسلة التهديد-الثغرة-الأثر.</div></div>\n</div>\n\n<h3>أبرز المحاور</h3><ul><li>القوس التركيبيّ للوحدات ١–٥</li><li>المصفوفة التكاملية: تهديد ← طبقة ← أثر ← تدبير</li><li>الخيوط الناظمة: من الميزة إلى الثغرة إلى التدبير</li><li>التأهيل للتقييم بأسئلةٍ محاكية</li></ul>", "lesson_en": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 6 · MID-COURSE REVIEW</div><h2>Mid-Course Review</h2></div>\n<p>This unit introduces no new content; it <b>weaves</b> Units 1–5 into one picture: how a threat connects to a layer, to an impact, to a countermeasure. Its goal is to let you see the forest after seeing the trees — moving from memorising concepts separately to linking them into one system that prepares you for assessment.</p>\n\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">The synthesis arc of Units 1–5</div><div class=\"concept-box-body\">We began with concepts (CIA and risk), then the network (layers), its threats (attacks), then cryptography (protection), then its application (modes and signatures). Each unit <b>opens</b> what the next one hardens.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">Connecting threads</div><div class=\"concept-box-body\"><b>From feature to vulnerability to control:</b> every feature opens an attack surface (connectivity enables interception, input enables injection), closed by a suitable control. Security is a constant balance, not a final state.</div></div>\n<div class=\"concept-box cb-history\"><div class=\"concept-box-title\">Exam preparation</div><div class=\"concept-box-body\">The assessment measures linking, not recall: mapping a threat to its layer, proposing its control, and scoring its severity. Review each unit's question bank in the Quiz tab.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🧩 Synthesis example (1): the integrative matrix</div>\n<div class=\"wstep\"><div class=\"wc\" style=\"padding-top:0\">The matrix traces risk from source to remedy: <b>threat → layer → impact → countermeasure</b>. Read each row as a single chain:</div></div>\n<table class=\"mtx\"><thead><tr><th>Threat</th><th>Layer</th><th>Impact (CIA)</th><th>Countermeasure</th></tr></thead><tbody>\n<tr><td>ARP poisoning</td><td>Network</td><td>Confidentiality/Integrity</td><td>Static ARP · DAI · TLS</td></tr>\n<tr><td>SYN flood</td><td>Transport</td><td>Availability</td><td>SYN cookies · rate limiting</td></tr>\n<tr><td>SQL injection</td><td>Application</td><td>Confidentiality/Integrity</td><td>Parameterized query</td></tr>\n<tr><td>Eavesdropping on a plain channel</td><td>Physical/Transport</td><td>Confidentiality</td><td>Encryption (TLS)</td></tr>\n<tr><td>Cracking an unsalted hash</td><td>Application</td><td>Confidentiality</td><td>Salting · slow hashing</td></tr>\n</tbody></table>\n<div class=\"wstep\"><div class=\"wc\" style=\"padding-top:0\"><b>The point:</b> breaking the chain at any link foils the attack — and the cheapest link to break is the optimal control.</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🗺️ Synthesis example (2): the Units 1–5 dependency map</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>Unit 1 (Concepts)</b> gives the vocabulary: asset, threat, vulnerability, risk — a frame that describes everything after it.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>Unit 2 (Networking)</b> draws the layers where threats sit; Unit 3's attacks cannot be understood without it.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>Unit 3 (Threats)</b> reveals the vulnerabilities in each layer — the very things that call for protection.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>Units 4–5 (Cryptography and its application)</b> provide the strongest control (encryption, signatures, modes) that closes many of Unit 3's gaps.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>The thread:</b> concept → structure → threat → control. Master this linkage and you master half the course.</div></div></div>\n\n<h3>Core flashcards — click to reveal</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">CIA Triad</div><div class=\"fc-en\">ثالوث CIA</div><div class=\"fc-def\">Confidentiality, integrity and availability — the three goals every security impact is measured against.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Risk</div><div class=\"fc-en\">الخطر</div><div class=\"fc-def\">The likelihood of a threat exploiting a vulnerability times the impact on the asset.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Encapsulation</div><div class=\"fc-en\">التغليف</div><div class=\"fc-def\">Each layer adding its header as data travels down to the wire.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">MITM</div><div class=\"fc-en\">هجوم الوسيط</div><div class=\"fc-def\">The attacker sitting between two parties, reading and altering their traffic.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Symmetric / Asymmetric</div><div class=\"fc-en\">التشفير المتناظر/غير المتناظر</div><div class=\"fc-def\">One secret key vs a public/private pair — the basis of all encryption controls.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Control</div><div class=\"fc-en\">التدبير المضادّ</div><div class=\"fc-def\">A measure that reduces risk by breaking the threat–vulnerability–impact chain.</div></div>\n</div>\n\n<h3>Key topics</h3><ul><li>The synthesis arc of Units 1–5</li><li>The integrative matrix: threat → layer → impact → control</li><li>Connecting threads: from feature to vulnerability to control</li><li>Exam preparation with mock questions</li></ul>", "lab": "match", "diagram": false, "brief": {"title": "تحدٍّ تركيبيّ (CTF مصغّر)", "env": "Docker: هدفٌ يجمع ثغرات 1–5", "goal": "يربط الطالب ثغرةً بطبقتها وتدبيرها في سيناريو واحد.", "verify": "سلسلة أعلامٍ متتابعة"}, "brief_en": {"title": "Integrative challenge (mini CTF)", "env": "Docker: a target combining Units 1–5 flaws", "goal": "Link a flaw to its layer and control in one scenario.", "verify": "A chain of successive flags"}, "quiz": {"q": "في المصفوفة التكاملية، ما التسلسل الصحيح؟", "opts": [{"t": "الأثر ← التهديد ← الطبقة ← التدبير", "ok": false}, {"t": "التهديد ← الطبقة ← الأثر ← التدبير المضادّ", "ok": true}, {"t": "التدبير ← الأثر ← الطبقة ← التهديد", "ok": false}, {"t": "الطبقة ← التدبير ← التهديد ← الأثر", "ok": false}], "why": "المصفوفة تتتبّع الخطر من مصدره: تهديدٌ يستغلّ ثغرةً في طبقةٍ فيُحدث أثراً، ويُكسَر بتدبيرٍ مضادّ."}, "quiz_en": {"q": "In the integrative matrix, what is the correct sequence?", "opts": [{"t": "Impact → Threat → Layer → Control", "ok": false}, {"t": "Threat → Layer → Impact → Countermeasure", "ok": true}, {"t": "Control → Impact → Layer → Threat", "ok": false}, {"t": "Layer → Control → Threat → Impact", "ok": false}], "why": "The matrix traces risk from its source: a threat exploits a vulnerability in a layer, causing an impact, broken by a countermeasure."}}, {"id": 6, "ar": "أمن البرمجيات والويب", "en": "Software & Web Security", "icon": "🕸️", "bg": "#FBEFEF", "desc": "إطار OWASP Top 10، حقن SQL و XSS، تجاوز سعة المخزن المؤقّت، والمضادّات.", "desc_en": "The OWASP Top 10, SQL injection and XSS, buffer overflow, and countermeasures.", "lesson": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 7 · SOFTWARE & WEB SECURITY</div><h2>أمن البرمجيات والويب</h2></div>\n<p>تطبيقات الويب سطح هجومٍ واسع، لأنّها تستقبل مدخلاتٍ من الخارج وتعالجها. يرتّب إطار <b>OWASP Top 10</b> أخطر الثغرات، وعلى رأسها <b>الحقن (Injection)</b> الذي ينشأ حين تُخلَط بيانات المستخدم بأوامر النظام. سنشرّح حمولة حقنٍ حقيقية، ونصنّف أنواع XSS، ثمّ نغلق الحلقة بالتدبير المضادّ.</p>\n\n<div class=\"concept-box cb-fail\"><div class=\"concept-box-title\">جذر المشكلة — خلط البيانات بالأوامر</div><div class=\"concept-box-body\">حين يُبنى الاستعلام بدمج مدخل المستخدم نصّياً، يصبح المدخل قادراً على <b>تغيير بنية الأمر</b> لا قيمته فقط — فتُنفَّذ البيانات كشيفرة. هذا جوهر الحقن بكلّ أنواعه (SQL، الأوامر، LDAP).</div></div>\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">حقن البرمجيات النصّية عبر المواقع — XSS</div><div class=\"concept-box-body\">يحقن المهاجم سكربتاً يُنفَّذ في متصفّح الضحيّة: <b>المخزَّن</b> يبقى في الخادم ويُصيب كلّ زائر · <b>المنعكس</b> يعود في الاستجابة عبر رابطٍ خبيث · <b>القائم على DOM</b> يُنفَّذ في المتصفّح دون مرورٍ بالخادم.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">مبدأ الدفاع — أغلِق الحلقة</div><div class=\"concept-box-body\">المختبر التعليميّ لا ينتهي بالاستغلال: استغلّ الثغرة، ثمّ طبّق التدبير (الاستعلامات المُعامَلة، ترميز المخرجات)، ثمّ <b>أثبت أنّ الحمولة نفسها فشلت</b>. جرّب ذلك حيّاً في تبويب المختبر.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🔎 مثال محلول (1): تشريح حمولة تجاوز مصادقة</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\">الاستعلام الأصليّ يدمج المدخل نصّياً: <span class=\"wcode\">SELECT * FROM users WHERE user='admin' AND pass='···'</span></div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">يُدخِل المهاجم في حقل كلمة المرور الحمولة: <span class=\"wcode\">' OR '1'='1</span></div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\">يصير الاستعلام: <span class=\"wcode\">... AND pass='' OR '1'='1'</span> — علامة الاقتباس أغلقت النصّ، و<span class=\"wcode\">OR '1'='1'</span> أضافت شرطاً <b>دائم الصدق</b>.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\">الشرط الكلّيّ يصير صادقاً لكلّ صفّ، فيعيد أوّل مستخدم (admin) ← <b>دخولٌ دون كلمة مرورٍ صحيحة</b>.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>التدبير:</b> استعلامٌ مُعامَل <span class=\"wcode\">WHERE user=? AND pass=?</span> يعامل المدخل بياناتٍ لا أمراً، فتفشل الحمولة نفسها. ✓ (أثبِته في المختبر.)</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🕸️ مثال محلول (2): تجاوز مرشّح XSS</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\">حقلٌ يعرض إدخال المستخدم دون ترميز؛ فيحاول المهاجم حقن سكربت.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">يرشّح المطوّر كلمة <span class=\"wcode\">script</span> ظنّاً أنّها كافية.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\">يتجاوزها المهاجم بسمة حدثٍ لا تحتاج الوسم المحجوب: <span class=\"wcode\">&lt;img src=x onerror=alert(1)&gt;</span></div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>الدرس:</b> الترشيح بالقوائم السوداء هشّ؛ الحلّ <b>ترميز المخرجات</b> (Output Encoding) وسياسة أمن المحتوى (CSP).</div></div></div>\n\n<h3>بطاقات المصطلحات — انقر للكشف</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">حقن SQL</div><div class=\"fc-en\">SQL Injection</div><div class=\"fc-def\">إدخال بياناتٍ خبيثةٍ تُغيّر بنية استعلام قاعدة البيانات فتُنفَّذ كأوامر.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">XSS</div><div class=\"fc-en\">Cross-Site Scripting</div><div class=\"fc-def\">حقن سكربتٍ يُنفَّذ في متصفّح ضحيّةٍ أخرى (مخزَّن/منعكس/DOM).</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">الاستعلام المُعامَل</div><div class=\"fc-en\">Parameterized Query</div><div class=\"fc-def\">فصل البيانات عن الأوامر بنيوياً، فلا يُفسَّر المدخل شيفرةً — أمتن تدبيرٍ ضدّ الحقن.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">ترميز المخرجات</div><div class=\"fc-en\">Output Encoding</div><div class=\"fc-def\">تحويل الرموز الخاصّة إلى صيغةٍ آمنةٍ عند العرض، يبطل XSS.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">تجاوز سعة المخزن</div><div class=\"fc-en\">Buffer Overflow</div><div class=\"fc-def\">كتابةٌ تتجاوز حدّ المخزن المؤقّت فتفسد الذاكرة المجاورة وقد تُنفِّذ شيفرة.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">OWASP Top 10</div><div class=\"fc-en\">OWASP Top 10</div><div class=\"fc-def\">قائمةٌ مرجعيّةٌ ترتّب أخطر عشر ثغراتٍ في تطبيقات الويب.</div></div>\n</div>\n\n<h3>أبرز المحاور</h3><ul><li>OWASP Top 10 كإطارٍ ناظم</li><li>أنواع XSS: مخزَّن، منعكس، قائم على DOM</li><li>تجاوز سعة المخزن المؤقّت (Buffer Overflow)</li><li>إغلاق الحلقة: استغلّ ← طبّق التدبير ← أثبت المنع</li></ul>", "lesson_en": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 7 · SOFTWARE & WEB SECURITY</div><h2>Software & Web Security</h2></div>\n<p>Web applications are a broad attack surface because they receive and process external input. The <b>OWASP Top 10</b> ranks the most dangerous flaws, led by <b>injection</b>, which arises when user data is mixed with system commands. We will dissect a real injection payload, classify XSS types, then close the loop with a countermeasure.</p>\n\n<div class=\"concept-box cb-fail\"><div class=\"concept-box-title\">Root cause — mixing data with commands</div><div class=\"concept-box-body\">When a query is built by concatenating user input as text, the input can <b>change the command's structure</b>, not just its value — so data is executed as code. This is the essence of injection in all its forms (SQL, command, LDAP).</div></div>\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">Cross-Site Scripting — XSS</div><div class=\"concept-box-body\">The attacker injects a script that runs in the victim's browser: <b>Stored</b> persists on the server and hits every visitor · <b>Reflected</b> returns in the response via a malicious link · <b>DOM-based</b> executes in the browser without reaching the server.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">Defence principle — close the loop</div><div class=\"concept-box-body\">A teaching lab does not end at exploitation: exploit the flaw, then apply the control (parameterized queries, output encoding), then <b>prove the same payload fails</b>. Try it live in the Lab tab.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🔎 Worked example (1): dissecting an auth-bypass payload</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\">The original query concatenates input as text: <span class=\"wcode\">SELECT * FROM users WHERE user='admin' AND pass='···'</span></div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">The attacker enters this payload in the password field: <span class=\"wcode\">' OR '1'='1</span></div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\">The query becomes: <span class=\"wcode\">... AND pass='' OR '1'='1'</span> — the quote closed the string, and <span class=\"wcode\">OR '1'='1'</span> added an <b>always-true</b> condition.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\">The overall condition becomes true for every row, returning the first user (admin) ← <b>login with no valid password</b>.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>Control:</b> a parameterized query <span class=\"wcode\">WHERE user=? AND pass=?</span> treats input as data, not a command, so the same payload fails. ✓ (Prove it in the Lab.)</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🕸️ Worked example (2): bypassing an XSS filter</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\">A field displays user input without encoding, so the attacker tries to inject a script.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">The developer filters the word <span class=\"wcode\">script</span>, assuming that is enough.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\">The attacker bypasses it with an event attribute that needs no blocked tag: <span class=\"wcode\">&lt;img src=x onerror=alert(1)&gt;</span></div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>Lesson:</b> blacklist filtering is fragile; the fix is <b>output encoding</b> and a Content-Security-Policy (CSP).</div></div></div>\n\n<h3>Flashcards — click to reveal</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">SQL Injection</div><div class=\"fc-en\">حقن SQL</div><div class=\"fc-def\">Injecting malicious data that changes a database query's structure so it executes as commands.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">XSS</div><div class=\"fc-en\">Cross-Site Scripting</div><div class=\"fc-def\">Injecting a script that runs in another victim's browser (stored/reflected/DOM).</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Parameterized Query</div><div class=\"fc-en\">الاستعلام المُعامَل</div><div class=\"fc-def\">Structurally separating data from commands so input is never code — the strongest control against injection.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Output Encoding</div><div class=\"fc-en\">ترميز المخرجات</div><div class=\"fc-def\">Converting special characters to a safe form on display, defeating XSS.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Buffer Overflow</div><div class=\"fc-en\">تجاوز سعة المخزن</div><div class=\"fc-def\">Writing past a buffer's limit, corrupting adjacent memory and possibly executing code.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">OWASP Top 10</div><div class=\"fc-en\">OWASP Top 10</div><div class=\"fc-def\">A reference list ranking the ten most critical web-application vulnerabilities.</div></div>\n</div>\n\n<h3>Key topics</h3><ul><li>OWASP Top 10 as a governing framework</li><li>XSS types: stored, reflected, DOM-based</li><li>Buffer overflow</li><li>Closing the loop: exploit → apply the control → prove prevention</li></ul>", "lab": "sqli", "diagram": false, "brief": {"title": "استغلال حقن SQL/XSS وإغلاق الحلقة", "env": "Docker: Kali + DVWA/Juice Shop (معزول)", "goal": "يستغلّ الحقن ثمّ يطبّق تدبيراً ويثبت منعه.", "verify": "الحمولة نفسها تفشل بعد الإصلاح"}, "brief_en": {"title": "SQL/XSS exploitation & loop closure", "env": "Docker: Kali + DVWA/Juice Shop (isolated)", "goal": "Exploit the injection, then apply a control and prove prevention.", "verify": "The same payload fails after the fix"}, "quiz": {"q": "ما التدبير الأمتن ضدّ حقن SQL؟", "opts": [{"t": "إخفاء رسائل الخطأ فقط", "ok": false}, {"t": "الاستعلامات المُعامَلة (parameterized queries)", "ok": true}, {"t": "تشفير قاعدة البيانات", "ok": false}, {"t": "تقييد طول المدخل فقط", "ok": false}], "why": "الاستعلامات المُعامَلة تفصل البيانات عن الأوامر فصلاً بنيوياً، فلا تُفسَّر مدخلات المستخدم أوامرَ SQL مهما كان محتواها."}, "quiz_en": {"q": "What is the strongest countermeasure against SQL injection?", "opts": [{"t": "Hiding error messages only", "ok": false}, {"t": "Parameterized queries", "ok": true}, {"t": "Encrypting the database", "ok": false}, {"t": "Limiting input length only", "ok": false}], "why": "Parameterized queries structurally separate data from commands, so user input is never interpreted as SQL whatever its content."}}, {"id": 7, "ar": "البرمجيات الخبيثة والسلوك العدائي", "en": "Malware & Adversarial Behaviour", "icon": "🦠", "bg": "#FBEFEF", "desc": "دورة حياة البرمجية الخبيثة وتصنيفها، أنواعها، الحمولة، والهندسة الاجتماعية.", "desc_en": "Malware lifecycle and classification, its types, payload, and social engineering.", "lesson": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 8 · MALWARE & ADVERSARIAL BEHAVIOUR</div><h2>البرمجيات الخبيثة والسلوك العدائي</h2></div>\n<p>البرمجية الخبيثة (Malware) برنامجٌ يُصمَّم للإضرار أو للوصول غير المصرَّح به. لكنّ الخطر لا يقتصر على الشيفرة: كثيرٌ من الاختراقات يبدأ بخداع <b>الإنسان</b> لا النظام. سنتتبّع دورة حياة هجومٍ ببرمجيةٍ خبيثة، ثمّ نشرّح خدعة هندسةٍ اجتماعية، ونختم بأسس الدفاع.</p>\n\n<div class=\"concept-box cb-fail\"><div class=\"concept-box-title\">أنواع البرمجيات الخبيثة</div><div class=\"concept-box-body\"><b>الفيروس</b> يلتصق بملفٍ مضيفٍ ويحتاج تشغيله · <b>الدودة</b> تنتشر ذاتياً عبر الشبكة · <b>حصان طروادة</b> يتنكّر ببرنامجٍ نافع · <b>الفدية</b> تعمّي الملفّات وتطلب فديةً · <b>الجذور الخفيّة (Rootkit)</b> تُخفي وجودها بعمق.</div></div>\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">الهندسة الاجتماعية</div><div class=\"concept-box-body\">استغلالٌ للإنسان لا للنظام: <b>تصيّدٌ</b> وخداعٌ لانتزاع بياناتٍ أو حملِ الضحيّة على تنفيذ إجراء. الحلقة الأضعف غالباً بشريّة، ولا يسدّها إلا الوعي.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">التحليل — ثابتٌ وسلوكيّ</div><div class=\"concept-box-body\"><b>التحليل الثابت</b> يفحص العيّنة دون تشغيلها (strings، قيمة اختزال، بنية الملفّ) · <b>السلوكيّ</b> يشغّلها في صندوقٍ رمليٍّ معزول لرصد أفعالها. كلاهما يُخرِج <b>مؤشّرات اختراق (IoCs)</b>.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🦠 مثال محلول (1): دورة حياة هجومٍ ببرمجيةٍ خبيثة</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>التسليم (Delivery):</b> مرفقٌ خبيثٌ في بريدٍ تصيّديّ يصل الضحيّة.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>التنفيذ (Execution):</b> يفتح الضحيّة المرفق، فتُشغَّل الشيفرة الخبيثة.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>الثبات (Persistence):</b> تُثبّت نفسها لتبقى بعد إعادة التشغيل (مفتاح تشغيلٍ، مهمّةٌ مجدولة).</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>التحكّم (C2):</b> تتّصل بخادم المهاجم لتلقّي الأوامر وتنزيل مكوّناتٍ إضافية.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>الحمولة (Payload):</b> تنفّذ هدفها — تعمية الملفّات (فدية)، أو سرقة بيانات، أو تجسّس. <b>قطع أيّ حلقةٍ</b> في هذه السلسلة يُحبِط الهجوم.</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🎣 مثال محلول (2): تشريح خدعة تصيّد</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>الاستعجال:</b> «حسابك سيُغلَق خلال 24 ساعة!» — يضغط عاطفياً ليمنع التفكير.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>انتحال المرسِل:</b> اسمٌ ظاهرٌ موثوق، لكنّ النطاق الحقيقيّ مزوّرٌ بحرفٍ مبدَّل.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>رابطٌ خادع:</b> نصّه يُظهر الموقع الرسميّ، ووجهته الفعليّة صفحةٌ منتحِلة تجمع الاعتماد.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>الدفاع:</b> تحقّق من النطاق الحقيقيّ، لا تنقر تحت الضغط، فعّل <b>المصادقة متعدّدة العوامل</b> فتصمد حتى لو سُرقت كلمة المرور.</div></div></div>\n\n<h3>بطاقات المصطلحات — انقر للكشف</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">الفيروس</div><div class=\"fc-en\">Virus</div><div class=\"fc-def\">برمجيةٌ خبيثةٌ تلتصق بملفٍ مضيفٍ وتحتاج تشغيله لتنشط وتنتشر.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">الدودة</div><div class=\"fc-en\">Worm</div><div class=\"fc-def\">برمجيةٌ تنسخ نفسها وتنتشر ذاتياً عبر الشبكة دون ملفٍ مضيف.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">حصان طروادة</div><div class=\"fc-en\">Trojan</div><div class=\"fc-def\">برمجيةٌ خبيثةٌ تتنكّر ببرنامجٍ نافعٍ ليشغّلها المستخدم طوعاً.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">الفدية</div><div class=\"fc-en\">Ransomware</div><div class=\"fc-def\">برمجيةٌ تعمّي ملفّات الضحيّة وتطلب فديةً لفكّها.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">الهندسة الاجتماعية</div><div class=\"fc-en\">Social Engineering</div><div class=\"fc-def\">خداع الإنسان لانتزاع معلوماتٍ أو حملِه على تنفيذ إجراءٍ ضارّ.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">مؤشّرات الاختراق</div><div class=\"fc-en\">IoCs</div><div class=\"fc-def\">أدلّةٌ تقنيّةٌ (قيم اختزال، عناوين، سلوك) تدلّ على وجود اختراق.</div></div>\n</div>\n\n<h3>أبرز المحاور</h3><ul><li>دورة الحياة: تسليم ← تنفيذ ← ثبات ← حمولة</li><li>أنواع البرمجيات الخبيثة وتصنيف الحمولة</li><li>التحليل الثابت مقابل السلوكيّ في صندوقٍ رمليّ</li><li>الهندسة الاجتماعية والدفاع بالوعي والمضادّات</li></ul>", "lesson_en": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 8 · MALWARE & ADVERSARIAL BEHAVIOUR</div><h2>Malware & Adversarial Behaviour</h2></div>\n<p>Malware is software designed to cause harm or gain unauthorised access. But the danger is not limited to code: many breaches begin by deceiving the <b>human</b>, not the system. We will trace the lifecycle of a malware attack, dissect a social-engineering ruse, then close with the foundations of defence.</p>\n\n<div class=\"concept-box cb-fail\"><div class=\"concept-box-title\">Types of malware</div><div class=\"concept-box-body\">A <b>virus</b> attaches to a host file and needs execution · a <b>worm</b> self-propagates over the network · a <b>trojan</b> disguises itself as useful software · <b>ransomware</b> encrypts files and demands a ransom · a <b>rootkit</b> hides its presence deep in the system.</div></div>\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">Social engineering</div><div class=\"concept-box-body\">Exploiting the human, not the system: <b>phishing</b> and deception to extract data or make the victim perform an action. The weakest link is often human, closed only by awareness.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">Analysis — static and behavioural</div><div class=\"concept-box-body\"><b>Static analysis</b> inspects the sample without running it (strings, hash, file structure) · <b>behavioural</b> runs it in an isolated sandbox to observe its actions. Both yield <b>Indicators of Compromise (IoCs)</b>.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🦠 Worked example (1): the malware attack lifecycle</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>Delivery:</b> a malicious attachment in a phishing email reaches the victim.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>Execution:</b> the victim opens the attachment, running the malicious code.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>Persistence:</b> it installs itself to survive reboots (a run key, a scheduled task).</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>Command & control (C2):</b> it contacts the attacker's server to receive commands and download extra components.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>Payload:</b> it executes its goal — encrypting files (ransomware), stealing data, or spying. <b>Cutting any link</b> in this chain foils the attack.</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🎣 Worked example (2): dissecting a phishing ruse</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>Urgency:</b> \"Your account will be closed within 24 hours!\" — emotional pressure to prevent thought.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>Sender spoofing:</b> a trusted-looking display name, but the real domain is forged with a swapped character.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>Deceptive link:</b> its text shows the official site, while its actual destination is a lookalike page that harvests credentials.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>Defence:</b> verify the real domain, don't click under pressure, and enable <b>multi-factor authentication</b> so you survive even if the password is stolen.</div></div></div>\n\n<h3>Flashcards — click to reveal</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Virus</div><div class=\"fc-en\">الفيروس</div><div class=\"fc-def\">Malware that attaches to a host file and needs execution to activate and spread.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Worm</div><div class=\"fc-en\">الدودة</div><div class=\"fc-def\">Malware that copies itself and self-propagates over the network with no host file.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Trojan</div><div class=\"fc-en\">حصان طروادة</div><div class=\"fc-def\">Malware disguised as useful software so the user runs it willingly.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Ransomware</div><div class=\"fc-en\">الفدية</div><div class=\"fc-def\">Malware that encrypts the victim's files and demands a ransom to decrypt them.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Social Engineering</div><div class=\"fc-en\">الهندسة الاجتماعية</div><div class=\"fc-def\">Deceiving a human to extract information or make them perform a harmful action.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">IoCs</div><div class=\"fc-en\">مؤشّرات الاختراق</div><div class=\"fc-def\">Technical evidence (hashes, addresses, behaviour) indicating a compromise.</div></div>\n</div>\n\n<h3>Key topics</h3><ul><li>Lifecycle: delivery → execution → persistence → payload</li><li>Malware types and payload classification</li><li>Static vs behavioural analysis in a sandbox</li><li>Social engineering and defence via awareness and anti-malware</li></ul>", "lab": "phish", "diagram": false, "brief": {"title": "تحليل عيّنةٍ تدريبية آمنة", "env": "VM معزولة تماماً (Host-Only، بلا شبكة)", "goal": "يستخرج strings/هاش ويرصد السلوك في صندوقٍ رمليّ.", "verify": "تقرير مؤشّرات اختراق (IoCs)"}, "brief_en": {"title": "Analysis of a safe training sample", "env": "Fully isolated VM (Host-Only, no network)", "goal": "Extract strings/hash and observe behaviour in a sandbox.", "verify": "Indicators-of-Compromise (IoCs) report"}, "quiz": {"q": "ما الفرق بين الفيروس والدودة؟", "opts": [{"t": "لا فرق", "ok": false}, {"t": "الدودة تنتشر ذاتياً عبر الشبكة دون ملفٍ مضيف، والفيروس يحتاج مضيفاً وتشغيلاً", "ok": true}, {"t": "الفيروس لا يضرّ", "ok": false}, {"t": "الدودة تحتاج مستخدماً دائماً", "ok": false}], "why": "الدودة تنسخ نفسها وتنتشر عبر الشبكة تلقائياً، بينما الفيروس يلتصق بملفٍ مضيفٍ ويحتاج تشغيله لينشط."}, "quiz_en": {"q": "What is the difference between a virus and a worm?", "opts": [{"t": "No difference", "ok": false}, {"t": "A worm self-propagates over the network with no host file; a virus needs a host and execution", "ok": true}, {"t": "A virus does no harm", "ok": false}, {"t": "A worm always needs a user", "ok": false}], "why": "A worm copies itself and spreads over the network automatically, while a virus attaches to a host file and needs execution to activate."}}, {"id": 8, "ar": "التشفير للاتصال الآمن", "en": "Cryptography for Secure Communication", "icon": "🔒", "bg": "#E4F1EE", "desc": "التدابير والضوابط الأمنية عبر طبقات التطبيق والنقل والشبكة (TLS، IPsec).", "desc_en": "Security measures and controls across the application, transport and network layers (TLS, IPsec).", "lesson": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 9 · CRYPTO FOR SECURE COMMUNICATION</div><h2>التشفير للاتصال الآمن</h2></div>\n<p>يُطبَّق التشفير عمليّاً كضوابط في طبقاتٍ مختلفة لتأمين الاتصال: من طبقة التطبيق (توقيع البريد وتعميته) إلى النقل (TLS) إلى الشبكة (IPsec). سنتتبّع مصافحة TLS التي تجمع التشفير غير المتناظر والمتناظر، ثمّ نقارن قناةً عاديّةً بأخرى مشفَّرة أمام متنصّت.</p>\n\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">ضوابط حسب الطبقة</div><div class=\"concept-box-body\"><b>التطبيق:</b> PGP وS-MIME لتوقيع البريد وتعميته · <b>النقل:</b> TLS يؤمّن الجلسة (HTTPS) · <b>الشبكة:</b> IPsec يؤمّن حزم IP عبر أنفاق VPN. لكلّ طبقةٍ ضابطُها المناسب للتهديد.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">البنية التحتية للمفاتيح — PKI</div><div class=\"concept-box-body\">الثقة تُبنى بالشهادات: <b>سلطة التصديق (CA)</b> توقّع شهادةً تربط هويّة الخادم بمفتاحه العام. فيثق العميل بالخادم لأنّه يثق بالـ CA الموقّعة — لا بالخادم مباشرةً.</div></div>\n<div class=\"concept-box cb-history\"><div class=\"concept-box-title\">لماذا تُدمَج العائلتان؟</div><div class=\"concept-box-body\">غير المتناظر بطيءٌ لكنّه يحلّ توزيع المفتاح؛ والمتناظر سريعٌ لكنّه يحتاج مفتاحاً مشتركاً. فتُستعمَل العائلة الأولى لتبادل مفتاح جلسةٍ متناظر، ثمّ تُعمّى البيانات بالثانية.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🔐 مثال محلول (1): مصافحة TLS خطوةً بخطوة</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>ClientHello:</b> يرسل العميل النسخ المدعومة ومجموعات الشفرات وقيمةً عشوائية.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>ServerHello + الشهادة:</b> يختار الخادم مجموعة الشفرات ويرسل <b>شهادته</b> (تحوي مفتاحه العام موقّعاً من CA).</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>التحقّق:</b> يتأكّد العميل من صحّة الشهادة عبر سلسلة الثقة إلى CA موثوقة — فيتيقّن من هويّة الخادم.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>تبادل المفتاح:</b> يُشتَقّ <b>مفتاح جلسةٍ متناظر</b> بأمان (بالمفتاح العام أو عبر Diffie–Hellman) لا يراه المتنصّت.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>الاتصال المشفَّر:</b> تُعمّى كلّ البيانات بمفتاح الجلسة المتناظر السريع. ✓ — اجتمع غير المتناظر (للتبادل والمصادقة) والمتناظر (للبيانات).</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">📡 مثال محلول (2): قناة عادية مقابل TLS أمام متنصّت</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>HTTP عاديّ:</b> يُرسَل اسم المستخدم وكلمة المرور <b>نصّاً عادياً</b> عبر الشبكة.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">متنصّتٌ بمحلّل حزم (مثل Wireshark) يلتقطها ويقرؤها فوراً ← <b>تسريبٌ للسرّية</b>.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>HTTPS (TLS):</b> يُغلَّف الاتصال نفسه بـ TLS، فتُعمّى البيانات قبل مغادرة الجهاز.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\">يلتقط المتنصّت الآن نصّاً مشفَّراً لا معنى له ← <b>فشل الاعتراض</b>. المحتوى محميّ حتى لو مرّ بشبكةٍ معادية.</div></div></div>\n\n<h3>بطاقات المصطلحات — انقر للكشف</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">TLS</div><div class=\"fc-en\">Transport Layer Security</div><div class=\"fc-def\">بروتوكولٌ يؤمّن جلسة النقل (HTTPS) بالتعمية والمصادقة عبر الشهادات.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">مصافحة TLS</div><div class=\"fc-en\">TLS Handshake</div><div class=\"fc-def\">تبادلٌ يتحقّق من الشهادة ويشتقّ مفتاح جلسةٍ قبل تعمية البيانات.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">سلطة التصديق</div><div class=\"fc-en\">Certificate Authority (CA)</div><div class=\"fc-def\">جهةٌ موثوقةٌ توقّع الشهادات فتضمن ارتباط الهويّة بمفتاحها العام.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">البنية التحتية للمفاتيح</div><div class=\"fc-en\">PKI</div><div class=\"fc-def\">منظومةٌ من الشهادات وسلطات التصديق تبني الثقة في المفاتيح العامّة.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">IPsec</div><div class=\"fc-en\">Internet Protocol Security</div><div class=\"fc-def\">مجموعة بروتوكولاتٍ تؤمّن حزم IP في طبقة الشبكة (عبر VPN مثلاً).</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">مفتاح الجلسة</div><div class=\"fc-en\">Session Key</div><div class=\"fc-def\">مفتاحٌ متناظرٌ مؤقّتٌ يُشتَقّ في المصافحة لتعمية بيانات الجلسة بسرعة.</div></div>\n</div>\n\n<h3>أبرز المحاور</h3><ul><li>مقارنة القناة العادية مقابل TLS</li><li>مصافحة TLS ودمج العائلتين</li><li>الشهادات والبنية التحتية للمفاتيح PKI</li><li>IPsec وأنفاق VPN، واختيار الضابط حسب الطبقة</li></ul>", "lesson_en": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 9 · CRYPTO FOR SECURE COMMUNICATION</div><h2>Cryptography for Secure Communication</h2></div>\n<p>Encryption is applied in practice as controls at different layers to secure communication: from the application layer (signing and encrypting mail) to transport (TLS) to network (IPsec). We will trace the TLS handshake that combines asymmetric and symmetric cryptography, then compare a plain channel with an encrypted one against an eavesdropper.</p>\n\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">Controls by layer</div><div class=\"concept-box-body\"><b>Application:</b> PGP and S-MIME to sign and encrypt mail · <b>Transport:</b> TLS secures the session (HTTPS) · <b>Network:</b> IPsec secures IP packets over VPN tunnels. Each layer has the control suited to its threat.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">Public-Key Infrastructure — PKI</div><div class=\"concept-box-body\">Trust is built with certificates: a <b>Certificate Authority (CA)</b> signs a certificate binding the server's identity to its public key. The client trusts the server because it trusts the signing CA — not the server directly.</div></div>\n<div class=\"concept-box cb-history\"><div class=\"concept-box-title\">Why combine the two families?</div><div class=\"concept-box-body\">Asymmetric is slow but solves key distribution; symmetric is fast but needs a shared key. So the first is used to exchange a symmetric session key, then the data is encrypted with the second.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🔐 Worked example (1): the TLS handshake step by step</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>ClientHello:</b> the client sends supported versions, cipher suites, and a random value.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>ServerHello + certificate:</b> the server picks a cipher suite and sends its <b>certificate</b> (containing its public key, signed by a CA).</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>Verification:</b> the client validates the certificate via the chain of trust to a trusted CA — confirming the server's identity.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>Key exchange:</b> a <b>symmetric session key</b> is securely derived (via the public key or Diffie–Hellman) that the eavesdropper cannot see.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>Encrypted connection:</b> all data is encrypted with the fast symmetric session key. ✓ — asymmetric (for exchange and authentication) met symmetric (for data).</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">📡 Worked example (2): plain channel vs TLS against an eavesdropper</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>Plain HTTP:</b> the username and password are sent as <b>cleartext</b> over the network.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">An eavesdropper with a packet sniffer (like Wireshark) captures and reads them instantly ← a <b>confidentiality breach</b>.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>HTTPS (TLS):</b> the same connection is wrapped in TLS, so data is encrypted before leaving the device.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\">The eavesdropper now captures meaningless ciphertext ← <b>interception fails</b>. The content is protected even across a hostile network.</div></div></div>\n\n<h3>Flashcards — click to reveal</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">TLS</div><div class=\"fc-en\">Transport Layer Security</div><div class=\"fc-def\">A protocol securing the transport session (HTTPS) via encryption and certificate authentication.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">TLS Handshake</div><div class=\"fc-en\">مصافحة TLS</div><div class=\"fc-def\">An exchange that verifies the certificate and derives a session key before encrypting data.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Certificate Authority (CA)</div><div class=\"fc-en\">سلطة التصديق</div><div class=\"fc-def\">A trusted party that signs certificates, vouching that an identity is bound to its public key.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">PKI</div><div class=\"fc-en\">البنية التحتية للمفاتيح</div><div class=\"fc-def\">A system of certificates and CAs that builds trust in public keys.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">IPsec</div><div class=\"fc-en\">Internet Protocol Security</div><div class=\"fc-def\">A protocol suite securing IP packets at the network layer (e.g., over VPN).</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Session Key</div><div class=\"fc-en\">مفتاح الجلسة</div><div class=\"fc-def\">A temporary symmetric key derived in the handshake to encrypt session data quickly.</div></div>\n</div>\n\n<h3>Key topics</h3><ul><li>Comparing a plain channel vs TLS</li><li>The TLS handshake and combining the two families</li><li>Certificates and the Public-Key Infrastructure (PKI)</li><li>IPsec and VPN tunnels, and choosing the control by layer</li></ul>", "lab": "tls", "diagram": false, "brief": {"title": "اعتراض بلا تشفير مقابل TLS", "env": "Docker: Kali + خادم", "goal": "يلتقط بيانات قناةٍ عاديّة ثمّ يعجز أمام TLS ويفحص المصافحة.", "verify": "التقاطٌ ناجح ثمّ فاشل بعد التشفير"}, "brief_en": {"title": "Plain vs TLS interception", "env": "Docker: Kali + server", "goal": "Capture data on a plain channel, then fail against TLS and inspect the handshake.", "verify": "Capture succeeds, then fails after encryption"}, "quiz": {"q": "لماذا تجمع TLS بين التشفير غير المتناظر والمتناظر؟", "opts": [{"t": "عشوائياً", "ok": false}, {"t": "غير المتناظر لتبادل مفتاح الجلسة بأمان، والمتناظر لتعمية البيانات بسرعة", "ok": true}, {"t": "لا تستعمل إلا المتناظر", "ok": false}, {"t": "لإبطاء الاتصال", "ok": false}], "why": "غير المتناظر بطيءٌ لكنّه يحلّ توزيع المفتاح؛ فيُستعمَل لتبادل مفتاح جلسةٍ متناظرٍ سريعٍ تُعمّى به بقيّة البيانات."}, "quiz_en": {"q": "Why does TLS combine asymmetric and symmetric encryption?", "opts": [{"t": "Randomly", "ok": false}, {"t": "Asymmetric to exchange the session key securely, symmetric to encrypt data quickly", "ok": true}, {"t": "It uses only symmetric", "ok": false}, {"t": "To slow the connection", "ok": false}], "why": "Asymmetric is slow but solves key distribution; it is used to exchange a fast symmetric session key that then encrypts the rest of the data."}}, {"id": 9, "ar": "المصادقة والتخويل والتحكّم بالوصول", "en": "Authentication, Authorization & Access Control", "icon": "🔑", "bg": "#FBF6E9", "desc": "مبادئ التحكّم بالوصول، عوامل المصادقة، نماذج DAC/MAC/RBAC، وإطار AAA.", "desc_en": "Access control principles, authentication factors, DAC/MAC/RBAC models, and the AAA framework.", "lesson": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 10 · AUTH & ACCESS CONTROL</div><h2>المصادقة والتخويل والتحكّم بالوصول</h2></div>\n<p>التحكّم بالوصول يحدّد <b>مَن</b> يصل إلى <b>ماذا</b>. يبدأ بالمصادقة (مَن أنت؟)، ثمّ التخويل (ما المسموح لك؟)، ثمّ المحاسبة (ماذا فعلت؟) — وهي أضلاع إطار AAA. وحمايةُ كلمات المرور المخزَّنة ركنٌ في المصادقة: لا تُخزَّن نصّاً، بل تُختزَل وتُملَّح. سنتتبّع التمليح، ونقارن نماذج التحكّم، ثمّ نطبّق في المختبر.</p>\n\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">عوامل المصادقة</div><div class=\"concept-box-body\"><b>شيءٌ تعرفه</b> (كلمة مرور) · <b>شيءٌ تملكه</b> (رمزٌ أو هاتف) · <b>شيءٌ فيك</b> (بصمة). الجمع بين عاملَين فأكثر هو <b>المصادقة متعدّدة العوامل (MFA)</b>، وتصمد أمام كسر كلمة المرور وحدها.</div></div>\n<div class=\"concept-box cb-fail\"><div class=\"concept-box-title\">لماذا لا تُخزَّن كلمات المرور نصّاً؟</div><div class=\"concept-box-body\">تسريب قاعدةٍ يكشفها كلّها. تُخزَّن قيمة اختزالها؛ لكنّ الاختزال غير المملَّح للكلمات الشائعة يُكسَر بجدولٍ جاهز (rainbow table). الحلّ: <b>التمليح</b> — قيمةٌ عشوائيّةٌ فريدةٌ لكلّ مستخدم.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">نماذج التحكّم بالوصول</div><div class=\"concept-box-body\"><b>DAC</b> تقديريّ (المالك يمنح) · <b>MAC</b> إلزاميّ (تصنيفاتٌ يفرضها النظام) · <b>RBAC</b> حسب الأدوار — وهو الأعمليّ لتطبيق مبدأ <b>أقلّ امتياز</b>.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🧂 مثال محلول (1): لماذا يُبطِل التمليح جدول البحث</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\">مستخدمٌ كلمة مروره <span class=\"wcode\">password</span>. بلا ملح: <span class=\"wcode\">H = SHA256(\"password\")</span> قيمةٌ ثابتةٌ معروفة.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">المهاجم يملك جدولاً مسبقاً (اختزال ← كلمة) للكلمات الشائعة، فيجد <span class=\"wcode\">H</span> فوراً ← كُسِرت.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\">مع التمليح: يُولَّد ملحٌ عشوائيّ فريد <span class=\"wcode\">s</span>، ويُخزَّن <span class=\"wcode\">H = SHA256(s + \"password\")</span> مع الملح.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\">تغيّر الملح يغيّر الناتج كلّه، فلا يطابق أيّ مدخلٍ في الجدول المسبق ← فشل الهجوم نفسه.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>الأثر:</b> الملح الفريد يجبر المهاجم على كسر كلّ حسابٍ على حدة، ويُبطِل الجداول المشتركة. أثبِته حيّاً في المختبر.</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🔐 مثال محلول (2): تطبيق أقلّ امتياز بـ RBAC</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\">في نظامٍ ماليّ: أدوارٌ ثلاثة — <b>محاسب</b>، <b>مدقّق</b>، <b>مدير</b>.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">تُسنَد الصلاحيات <b>للدور</b> لا للفرد: المحاسب يُنشئ القيود، المدقّق يقرأ فقط، المدير يعتمد.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\">يُسنَد المستخدم إلى دورٍ واحد، فينال أقلّ امتيازٍ يكفي لعمله لا أكثر (<b>أقلّ امتياز</b>).</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>الفائدة:</b> عند تغيّر مهامّ موظّفٍ يُبدَّل دوره فقط؛ ويمنع <b>الفصل بين الواجبات</b> أن يُنشئ قيداً ويعتمده الشخص نفسه.</div></div></div>\n\n<h3>بطاقات المصطلحات — انقر للكشف</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">المصادقة</div><div class=\"fc-en\">Authentication</div><div class=\"fc-def\">التحقّق من هويّة المستخدم (مَن أنت؟) عبر عاملٍ أو أكثر.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">التخويل</div><div class=\"fc-en\">Authorization</div><div class=\"fc-def\">تحديد ما يُسمَح للمستخدم المُصادَق بالوصول إليه أو فعله.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">المصادقة متعدّدة العوامل</div><div class=\"fc-en\">MFA</div><div class=\"fc-def\">الجمع بين عاملَين مختلفين فأكثر (تعرفه/تملكه/فيك) لتقوية المصادقة.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">التمليح</div><div class=\"fc-en\">Salting</div><div class=\"fc-def\">إضافة قيمةٍ عشوائيّةٍ فريدةٍ قبل الاختزال تُبطِل جداول البحث المسبقة.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">التحكّم حسب الأدوار</div><div class=\"fc-en\">RBAC</div><div class=\"fc-def\">إسناد الصلاحيات لأدوارٍ ثمّ إسناد المستخدمين إليها، لتطبيق أقلّ امتياز.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">أقلّ امتياز</div><div class=\"fc-en\">Least Privilege</div><div class=\"fc-def\">منح المستخدم أدنى صلاحيةٍ تكفي لأداء مهمّته لا أكثر.</div></div>\n</div>\n\n<h3>أبرز المحاور</h3><ul><li>مبدأ أقلّ امتياز والفصل بين الواجبات</li><li>كسر كلمات المرور والتمليح</li><li>نماذج DAC/MAC/RBAC</li><li>إطار AAA: المصادقة والتخويل والمحاسبة</li></ul>", "lesson_en": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 10 · AUTH & ACCESS CONTROL</div><h2>Authentication, Authorization & Access Control</h2></div>\n<p>Access control decides <b>who</b> reaches <b>what</b>. It begins with authentication (who are you?), then authorization (what may you do?), then accounting (what did you do?) — the pillars of the AAA framework. Protecting stored passwords is a cornerstone of authentication: never store them in plaintext, but hash and salt them. We will trace salting, compare control models, then apply it in the lab.</p>\n\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">Authentication factors</div><div class=\"concept-box-body\"><b>Something you know</b> (a password) · <b>something you have</b> (a token or phone) · <b>something you are</b> (a biometric). Combining two or more is <b>multi-factor authentication (MFA)</b>, which survives the cracking of a password alone.</div></div>\n<div class=\"concept-box cb-fail\"><div class=\"concept-box-title\">Why not store passwords in plaintext?</div><div class=\"concept-box-body\">A single leak exposes them all. Store their hash instead; but unsalted hashes of common passwords fall to a precomputed rainbow table. The fix: <b>salting</b> — a unique random value per user.</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">Access control models</div><div class=\"concept-box-body\"><b>DAC</b> discretionary (the owner grants) · <b>MAC</b> mandatory (system-enforced labels) · <b>RBAC</b> role-based — the most practical for applying <b>least privilege</b>.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🧂 Worked example (1): why salting defeats the lookup table</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\">A user's password is <span class=\"wcode\">password</span>. Without salt: <span class=\"wcode\">H = SHA256(\"password\")</span> is a fixed, well-known value.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">The attacker holds a precomputed table (hash ← word) of common passwords, finds <span class=\"wcode\">H</span> instantly ← cracked.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\">With salting: a unique random salt <span class=\"wcode\">s</span> is generated, and <span class=\"wcode\">H = SHA256(s + \"password\")</span> is stored with the salt.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\">Changing the salt changes the whole output, so it matches no precomputed entry ← the same attack fails.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>Effect:</b> a unique salt forces the attacker to crack each account separately and defeats shared tables. Prove it live in the Lab.</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🔐 Worked example (2): applying least privilege with RBAC</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\">In a finance system: three roles — <b>accountant</b>, <b>auditor</b>, <b>manager</b>.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\">Permissions attach to the <b>role</b>, not the individual: the accountant creates entries, the auditor reads only, the manager approves.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\">Each user is assigned one role, receiving the minimum privilege sufficient for their job, no more (<b>least privilege</b>).</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>Benefit:</b> when someone's duties change you just switch their role; and <b>separation of duties</b> stops the same person creating and approving an entry.</div></div></div>\n\n<h3>Flashcards — click to reveal</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Authentication</div><div class=\"fc-en\">المصادقة</div><div class=\"fc-def\">Verifying a user's identity (who are you?) via one or more factors.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Authorization</div><div class=\"fc-en\">التخويل</div><div class=\"fc-def\">Determining what an authenticated user is allowed to access or do.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">MFA</div><div class=\"fc-en\">المصادقة متعدّدة العوامل</div><div class=\"fc-def\">Combining two or more distinct factors (know/have/are) to strengthen authentication.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Salting</div><div class=\"fc-en\">التمليح</div><div class=\"fc-def\">Adding a unique random value before hashing to defeat precomputed lookup tables.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">RBAC</div><div class=\"fc-en\">التحكّم حسب الأدوار</div><div class=\"fc-def\">Assigning permissions to roles then users to roles, to apply least privilege.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Least Privilege</div><div class=\"fc-en\">أقلّ امتياز</div><div class=\"fc-def\">Granting a user the minimum privilege sufficient for their task, no more.</div></div>\n</div>\n\n<h3>Key topics</h3><ul><li>Least privilege and separation of duties</li><li>Password cracking and salting</li><li>DAC/MAC/RBAC models</li><li>The AAA framework: authentication, authorization, accounting</li></ul>", "lab": "crack", "diagram": false, "brief": {"title": "كسر كلمات مرور وتطبيق RBAC", "env": "Docker: Kali + خدمة مصادقة", "goal": "يكسر بـ Hydra ثمّ يضبط RBAC ويثبت الحجب.", "verify": "فشل الكسر/الوصول بعد التدبير"}, "brief_en": {"title": "Password cracking & RBAC", "env": "Docker: Kali + auth service", "goal": "Crack with Hydra, then configure RBAC and prove the block.", "verify": "Cracking/access fails after the control"}, "quiz": {"q": "أيّ نموذجٍ يمنح الصلاحيات حسب دور المستخدم لا هويّته الفردية؟", "opts": [{"t": "DAC", "ok": false}, {"t": "MAC", "ok": false}, {"t": "RBAC", "ok": true}, {"t": "لا شيء", "ok": false}], "why": "RBAC يربط الصلاحيات بأدوارٍ (محاسب، مدير…) ويُسنِد المستخدمين إليها، فيبسّط الإدارة ويطبّق أقلّ امتياز."}, "quiz_en": {"q": "Which model grants permissions by the user's role rather than individual identity?", "opts": [{"t": "DAC", "ok": false}, {"t": "MAC", "ok": false}, {"t": "RBAC", "ok": true}, {"t": "None", "ok": false}], "why": "RBAC binds permissions to roles (accountant, manager…) and assigns users to them, simplifying administration and applying least privilege."}}, {"id": 10, "ar": "التقنيات الدفاعية", "en": "Defensive Technologies", "icon": "🧱", "bg": "#E4F1EE", "desc": "جدران الحماية، أنظمة كشف ومنع التسلّل IDS/IPS، مصائد العسل، والدفاع في العمق.", "desc_en": "Firewalls, intrusion detection/prevention (IDS/IPS), honeypots, and defence in depth.", "lesson": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 11 · DEFENSIVE TECHNOLOGIES</div><h2>التقنيات الدفاعية</h2></div>\n<p>لا يوجد ضابطٌ واحدٌ كافٍ. المبدأ الحاكم <b>الدفاع في العمق</b>: رصُّ طبقاتٍ متعدّدة من الضوابط بحيث تعوّض كلٌّ منها ثغرة ما قبلها، فلا نقطة فشلٍ واحدة. وحين يخترق مهاجمٌ الطبقات، يأتي دور <b>الاستجابة للحوادث</b> (الفريق الأزرق). سنطبّق الطبقتين في مثالَين محلولَين.</p>\n\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">جدار الحماية و IDS/IPS</div><div class=\"concept-box-body\"><b>جدار الحماية</b> يرشّح الحركة بالسياسة (رفضٌ افتراضيّ) · <b>IDS</b> يكشف الهجوم ويُنبّه دون تدخّل · <b>IPS</b> يقع في مسار الحركة فيكشف <b>ويحجب</b> آنياً. الكشف نوعان: بالتواقيع (أنماطٌ معروفة) وبالسلوك الشاذّ (novel).</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">مصائد العسل — Honeypots</div><div class=\"concept-box-body\">أنظمةٌ طُعمٌ تبدو أهدافاً جذّابة، تُغري المهاجم <b>لدراسة أساليبه</b> وصرفه عن الأصول الحقيقية، وتُنتج إنذاراتٍ عالية الدقّة (فأيّ تفاعلٍ معها مشبوهٌ بطبيعته).</div></div>\n<div class=\"concept-box cb-history\"><div class=\"concept-box-title\">الأحمر والأزرق</div><div class=\"concept-box-body\">الأمن ليس هجوماً فقط: <b>الفريق الأحمر</b> يهاجم ليكشف الثغرات، و<b>الأزرق</b> يدافع ويرصد ويستجيب. المختبر الحقّ يغلق الحلقة: هاجِم، أصلِح، ثمّ أثبِت المنع.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🧱 مثال محلول (1): الدفاع في العمق أمام هجومٍ ملموس</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>المحيط:</b> جدار حمايةٍ برفضٍ افتراضيّ يحجب المنافذ غير اللازمة — يوقف المسح العشوائيّ.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>الكشف:</b> IPS يرصد نمط هجومٍ معروفٍ في الحركة المسموحة ويحجبه — يوقف الاستغلال الآليّ.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>الوصول:</b> مبدأ أقلّ امتيازٍ و<b>المصادقة متعدّدة العوامل</b> — يحدّ من الضرر لو سُرق اعتمادٌ.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>البيانات:</b> تشفيرها ساكنةً وأثناء النقل — يُبطِل قيمة السرقة لو وصل المهاجم إليها.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>الأثر:</b> اختراق طبقةٍ لا يعني اختراق النظام؛ كلّ طبقةٍ تشتري وقتاً وترفع كلفة الهجوم. ✓</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🔵 مثال محلول (2): دورة الاستجابة للحوادث</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>الكشف:</b> يُظهر سجلٌّ دخولاتٍ فاشلةً كثيرةً ثمّ دخولاً ناجحاً من عنوانٍ غريب خارج ساعات العمل.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>التحليل:</b> يربط المحلّل الحدث بمؤشّرات اختراقٍ (عنوان، وقت، سلوك) ويؤكّد أنّه اختراقٌ لا إنذارٌ كاذب.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>الاحتواء:</b> يعزل الحساب/الجهاز المصاب ويكتب قاعدة جدار حمايةٍ تحجب العنوان المهاجم — لوقف الانتشار.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>الاستئصال والتعافي:</b> يزيل موطئ القدم، يعيد من نسخةٍ نظيفة، ثمّ يوثّق الدرس ويشدّ الضابط. أُغلقت الحلقة.</div></div></div>\n\n<h3>بطاقات المصطلحات — انقر للكشف</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">جدار الحماية</div><div class=\"fc-en\">Firewall</div><div class=\"fc-def\">ضابطٌ يرشّح حركة الشبكة وفق سياسةٍ محدَّدة (سماحٌ أو حجب).</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">نظام كشف التسلّل</div><div class=\"fc-en\">IDS</div><div class=\"fc-def\">نظامٌ يرصد النشاط المشبوه ويُنبّه دون التدخّل لحجبه.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">نظام منع التسلّل</div><div class=\"fc-en\">IPS</div><div class=\"fc-def\">نظامٌ يقع في مسار الحركة فيكشف الهجوم ويحجبه آنياً.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">مصيدة العسل</div><div class=\"fc-en\">Honeypot</div><div class=\"fc-def\">نظامٌ طُعمٌ يُغري المهاجم لدراسة أساليبه وصرفه عن الأصول.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">الدفاع في العمق</div><div class=\"fc-en\">Defence in Depth</div><div class=\"fc-def\">رصُّ ضوابطَ متعدّدةٍ متكاملةٍ لئلّا تكون هناك نقطة فشلٍ واحدة.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">الاستجابة للحوادث</div><div class=\"fc-en\">Incident Response</div><div class=\"fc-def\">دورةٌ منهجيّة: كشف ← تحليل ← احتواء ← استئصال ← تعافٍ ← توثيق.</div></div>\n</div>\n\n<h3>أبرز المحاور</h3><ul><li>أنواع جدران الحماية وسياساتها</li><li>IDS مقابل IPS: الكشف مقابل المنع</li><li>مصائد العسل والكشف بالتواقيع مقابل السلوك</li><li>الدفاع في العمق والاستجابة للحوادث (الفريق الأزرق)</li></ul>", "lesson_en": "<div class=\"uhero\"><div class=\"uhero-k\">UNIT 11 · DEFENSIVE TECHNOLOGIES</div><h2>Defensive Technologies</h2></div>\n<p>No single control is enough. The governing principle is <b>defence in depth</b>: stacking multiple layers of controls so each compensates for a gap in the one before it — no single point of failure. And when an attacker breaks through the layers, <b>incident response</b> (the blue team) takes over. We will apply both layers in two worked examples.</p>\n\n<div class=\"concept-box cb\"><div class=\"concept-box-title\">Firewall & IDS/IPS</div><div class=\"concept-box-body\">A <b>firewall</b> filters traffic by policy (default-deny) · an <b>IDS</b> detects an attack and alerts without intervening · an <b>IPS</b> sits inline and detects <b>and blocks</b> in real time. Detection is of two kinds: signature-based (known patterns) and anomaly-based (novel).</div></div>\n<div class=\"concept-box\"><div class=\"concept-box-title\">Honeypots</div><div class=\"concept-box-body\">Decoy systems that look like attractive targets, luring the attacker to <b>study their methods</b> and divert them from real assets, producing high-fidelity alerts (any interaction with them is inherently suspicious).</div></div>\n<div class=\"concept-box cb-history\"><div class=\"concept-box-title\">Red and blue</div><div class=\"concept-box-body\">Security is not only offence: the <b>red team</b> attacks to reveal flaws, and the <b>blue team</b> defends, monitors and responds. A true lab closes the loop: attack, fix, then prove prevention.</div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🧱 Worked example (1): defence in depth against a concrete attack</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>Perimeter:</b> a default-deny firewall blocks unnecessary ports — stopping random scanning.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>Detection:</b> an IPS spots a known attack pattern in the allowed traffic and blocks it — stopping automated exploitation.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>Access:</b> least privilege and <b>multi-factor authentication</b> — limiting damage if a credential is stolen.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>Data:</b> encryption at rest and in transit — voiding the value of theft if the attacker reaches it.</div></div>\n<div class=\"wstep\"><div class=\"wn\">5</div><div class=\"wc\"><b>Effect:</b> breaching one layer does not mean breaching the system; each layer buys time and raises the attack's cost. ✓</div></div></div>\n\n<div class=\"worked\"><div class=\"worked-title\">🔵 Worked example (2): the incident-response cycle</div>\n<div class=\"wstep\"><div class=\"wn\">1</div><div class=\"wc\"><b>Detection:</b> a log shows many failed logins then a successful one from an unusual address outside working hours.</div></div>\n<div class=\"wstep\"><div class=\"wn\">2</div><div class=\"wc\"><b>Analysis:</b> the analyst links the event to indicators of compromise (address, time, behaviour) and confirms it is a breach, not a false alarm.</div></div>\n<div class=\"wstep\"><div class=\"wn\">3</div><div class=\"wc\"><b>Containment:</b> isolate the affected account/host and write a firewall rule blocking the attacking address — to stop the spread.</div></div>\n<div class=\"wstep\"><div class=\"wn\">4</div><div class=\"wc\"><b>Eradication & recovery:</b> remove the foothold, restore from a clean backup, then document the lesson and harden the control. Loop closed.</div></div></div>\n\n<h3>Flashcards — click to reveal</h3>\n<div class=\"fc-grid\">\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Firewall</div><div class=\"fc-en\">جدار الحماية</div><div class=\"fc-def\">A control that filters network traffic according to a defined policy (allow or block).</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">IDS</div><div class=\"fc-en\">نظام كشف التسلّل</div><div class=\"fc-def\">A system that monitors suspicious activity and alerts without intervening to block it.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">IPS</div><div class=\"fc-en\">نظام منع التسلّل</div><div class=\"fc-def\">A system that sits inline, detecting an attack and blocking it in real time.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Honeypot</div><div class=\"fc-en\">مصيدة العسل</div><div class=\"fc-def\">A decoy system that lures an attacker to study their methods and divert them from assets.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Defence in Depth</div><div class=\"fc-en\">الدفاع في العمق</div><div class=\"fc-def\">Stacking multiple integrated controls so there is no single point of failure.</div></div>\n<div class=\"fc\" onclick=\"flipCard(this)\"><div class=\"fc-hint\">↻</div><div class=\"fc-term\">Incident Response</div><div class=\"fc-en\">الاستجابة للحوادث</div><div class=\"fc-def\">A systematic cycle: detect → analyse → contain → eradicate → recover → document.</div></div>\n</div>\n\n<h3>Key topics</h3><ul><li>Firewall types and policies</li><li>IDS vs IPS: detection vs prevention</li><li>Honeypots, and signature vs behavioural detection</li><li>Defence in depth and incident response (the blue team)</li></ul>", "lab": "defend", "diagram": false, "brief": {"title": "جدار حماية + IDS + مختبر أزرق للاستجابة", "env": "Docker: Kali + Snort/iptables + سجلّات", "goal": "يكتب قاعدةً تحجب هجوماً، ويحلّل سجلّاً ليكتشف اختراقاً ويحتويه.", "verify": "كشف الاختراق من السجلّ + قاعدة صادّة"}, "brief_en": {"title": "Firewall + IDS + blue incident-response lab", "env": "Docker: Kali + Snort/iptables + logs", "goal": "Write a rule that blocks an attack, and analyse a log to detect and contain an intrusion.", "verify": "Intrusion detected from the log + a blocking rule"}, "quiz": {"q": "ما الفرق بين IDS و IPS؟", "opts": [{"t": "لا فرق", "ok": false}, {"t": "IDS يكشف ويُنبّه فقط، وIPS يكشف ويمنع الهجوم فوراً", "ok": true}, {"t": "IPS أبطأ دائماً", "ok": false}, {"t": "IDS يمنع الهجوم", "ok": false}], "why": "IDS نظام كشفٍ يرصد ويُنبّه دون تدخّل، بينما IPS يقع في مسار الحركة فيكشف ويحجب الهجوم آنياً."}, "quiz_en": {"q": "What is the difference between an IDS and an IPS?", "opts": [{"t": "No difference", "ok": false}, {"t": "An IDS detects and alerts only; an IPS detects and blocks the attack immediately", "ok": true}, {"t": "An IPS is always slower", "ok": false}, {"t": "An IDS blocks the attack", "ok": false}], "why": "An IDS is a detection system that monitors and alerts without intervening, while an IPS sits inline and detects and blocks the attack in real time."}}];

/* ===== مختبر أنماط الكتل ECB مقابل CBC (AES حقيقيّ في المتصفّح) ===== */
function getBlockLabHTML(){
  var L=state.language==='ar';
  var def='YES!YES!YES!YES!YES!YES!YES!YES!';
  return '<div class="lab-scenario">'+(L
    ?'شفّر نصّاً فيه تَكرار بنمطَي ECB وCBC (بتعمية AES حقيقيّة على جهازك)، ولاحظ كيف يفضح ECB الكتل المتطابقة بينما يُخفيها CBC.'
    :'Encrypt a repetitive text in ECB and CBC modes (real on-device AES) and see how ECB exposes identical blocks while CBC hides them.')+'</div>'
  +'<div class="lab-container"><div class="lab-header"><span class="lab-icon">🧱</span><div>'
    +'<div class="lab-title">'+(L?'ECB مقابل CBC':'ECB vs CBC')+'</div>'
    +'<div class="lab-subtitle">AES-256 · Web Crypto API · '+(L?'كتل 16 بايت':'16-byte blocks')+'</div></div></div>'
  +'<div class="lab-field"><label class="lab-label">'+(L?'النصّ (جرّب نصّاً متكرّراً)':'Text (try a repetitive input)')+'</label>'
    +'<input class="lab-input" id="blk-in" value="'+def+'"></div>'
  +'<button class="btn btn-primary" onclick="runBlockLab()">▶ '+(L?'شفّر وقارن':'Encrypt & compare')+'</button>'
  +'<div id="blk-out" style="margin-top:16px"></div></div>';
}
function _blkColor(b){ var h=b[0].toString(16).padStart(2,"0")+b[1].toString(16).padStart(2,"0")+b[2].toString(16).padStart(2,"0"); return "#"+h; }
function _blkRow(title, blocks){
  var cells=blocks.map(function(b){ var c=_blkColor(b); return '<div title="'+c+'" style="width:34px;height:34px;border-radius:6px;background:'+c+';border:1px solid rgba(0,0,0,.15)"></div>'; }).join('');
  return '<div style="margin:10px 0"><div class="lab-label">'+title+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+cells+'</div></div>';
}
async function _ecbBlock(key, block16){
  // AES-CBC بمتّجه صفريّ على كتلةٍ واحدة: أوّل 16 بايت = AES-ECB لتلك الكتلة
  var zero=new Uint8Array(16);
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC',iv:zero}, key, block16));
  return ct.slice(0,16);
}
function _xor(a,b){ var o=new Uint8Array(16); for(var i=0;i<16;i++) o[i]=a[i]^b[i]; return o; }
async function runBlockLab(){
  var L=state.language==='ar';
  var out=document.getElementById('blk-out');
  try{
    var txt=document.getElementById('blk-in').value;
    var raw=new TextEncoder().encode(txt);
    // قسّم إلى كتل 16 بايت (احشُ الأخيرة بأصفار)
    var n=Math.max(1,Math.ceil(raw.length/16)), blocks=[];
    for(var i=0;i<n;i++){ var blk=new Uint8Array(16); blk.set(raw.slice(i*16,i*16+16)); blocks.push(blk); }
    var key=await crypto.subtle.generateKey({name:'AES-CBC',length:256}, true, ['encrypt','decrypt']);
    // ECB: كلّ كتلةٍ مستقلّةً
    var ecb=[]; for(i=0;i<blocks.length;i++){ ecb.push(await _ecbBlock(key, blocks[i])); }
    // CBC: سلسلةٌ بمتّجه تهيئةٍ عشوائيّ
    var iv=crypto.getRandomValues(new Uint8Array(16)), prev=iv, cbc=[];
    for(i=0;i<blocks.length;i++){ var c=await _ecbBlock(key, _xor(blocks[i],prev)); cbc.push(c); prev=c; }
    // كشف التطابق في ECB
    var seen={}, dup=0; ecb.forEach(function(b){ var k=Array.from(b.slice(0,4)).join(','); if(seen[k])dup++; seen[k]=1; });
    out.innerHTML = _blkRow('🔴 ECB — '+(L?'كلّ كتلةٍ مستقلّة':'each block independent'), ecb)
      + _blkRow('🔵 CBC — '+(L?'مسلسَلة عبر XOR':'chained via XOR'), cbc)
      + '<div class="concept-box '+(dup>0?'cb-fail':'cb')+'" style="margin-top:12px"><div class="concept-box-body">'
      + (dup>0
          ? (L?('لاحظ: '+dup+' كتلة متطابقة اللون في ECB (نفس الأصل ← نفس التعمية) — تسريبٌ للأنماط. أمّا CBC فكلّ كتلةٍ مختلفة.')
              :('Notice: '+dup+' identically-coloured block(s) in ECB (same plaintext → same ciphertext) — pattern leakage. In CBC every block differs.'))
          : (L?'جرّب نصّاً فيه تَكرار (مثل النصّ الافتراضيّ) لترى كتلاً متطابقةً في ECB لا في CBC.'
              :'Try a repetitive text (like the default) to see identical blocks in ECB but not in CBC.'))
      + '</div></div>';
    lessonState.labRecallValue = (L?'أنماط الكتل: كتل ECB المتطابقة = ':'Block modes: identical ECB blocks = ')+dup;
    completeLabStage();
  }catch(e){ out.innerHTML='<div class="lab-output error">'+(L?'تعذّر التشفير: ':'Encryption failed: ')+e.message+'</div>'; }
}

  return '<div class="lab-scenario">'+(L

function runSqliLab(silent){
  var L=state.language==='ar';
  var u=document.getElementById('sqli-u').value, p=document.getElementById('sqli-p').value;
  var qEl=document.getElementById('sqli-q'), out=document.getElementById('sqli-out');
  var granted=false, matched=null;
  if(_sqliSecure){
    // مطابقةٌ معامَلة: المدخل بياناتٌ لا شيفرة
    qEl.textContent = "SELECT * FROM users WHERE user=? AND pass=?   [u="+u+", p="+p+"]";
    matched = SQLI_DB.find(function(r){ return r.u===u && r.p===p; });
    granted = !!matched;
  } else {
    // ضعيف: دمج المدخل نصّياً في الاستعلام
    var query = "SELECT * FROM users WHERE user='"+u+"' AND pass='"+p+"'";
    qEl.textContent = query;
    // محاكاةٌ مبسّطة لمنطق SQL: شرط OR دائم الصدق يتجاوز المصادقة
    var tautology = /'\s*OR\s*'?1'?\s*=\s*'?1/i.test(p) || /'\s*OR\s*'?1'?\s*=\s*'?1/i.test(u);
    if(tautology){ granted=true; matched=SQLI_DB[0]; }
    else { matched = SQLI_DB.find(function(r){ return r.u===u && r.p===p; }); granted=!!matched; }
  }
  if(granted){
    var cls = _sqliSecure ? 'cb' : 'cb-fail';
    var head = _sqliSecure
      ? (L?'✅ دخولٌ مشروع (ببيانات اعتمادٍ صحيحة)':'✅ Legitimate login (valid credentials)')
      : (L?'🔴 تجاوُز المصادقة عبر حقن SQL!':'🔴 Authentication bypass via SQL injection!');
    var body = _sqliSecure
      ? (L?'المطابقة المعامَلة عاملت المدخل بياناتٍ لا أوامر، فلم ينجح إلا الاعتماد الصحيح.':'Parameterized matching treated input as data, so only valid credentials worked.')
      : (L?('الشرط ‏'+"'1'='1'"+' دائم الصدق جعل الاستعلام يعيد أوّل مستخدم — دخلتَ باسم «'+matched.role+'» دون كلمة مرورٍ صحيحة.')
          :('The always-true '+"'1'='1'"+' condition made the query return the first user — you logged in as "'+matched.role+'" with no valid password.'));
    out.innerHTML='<div class="concept-box '+cls+'"><div class="concept-box-title">'+head+'</div><div class="concept-box-body">'+body+'</div></div>';
    if(!_sqliSecure){ lessonState.labRecallValue=(L?'حقن SQL: تجاوُز المصادقة بـ ':'SQLi: auth bypass via ')+"' OR '1'='1"; completeLabStage(); }
    else { lessonState.labRecallValue=(L?'أُغلقت الحلقة: الاستعلامات المُعامَلة تصدّ الحقن':'Loop closed: parameterized queries block the injection'); completeLabStage(); }
  } else {
    out.innerHTML='<div class="concept-box '+(_sqliSecure?'cb':'')+'"><div class="concept-box-body">'
      +(_sqliSecure
        ? (L?'🛡️ رُفض الدخول: الحمولة '+"' OR '1'='1"+' لم تعُد تُفسَّر أمراً — التدبير نجح. جرّب اعتماداً صحيحاً (admin / S3cr3t!).':'🛡️ Access denied: the '+"' OR '1'='1"+' payload is no longer interpreted as code — the control works. Try valid credentials (admin / S3cr3t!).')
        : (L?'❌ فشل الدخول ببيانات خاطئة. جرّب كلمة المرور: '+"' OR '1'='1":'❌ Login failed with wrong data. Try the password: '+"' OR '1'='1"))
      +'</div></div>';
    if(_sqliSecure){ lessonState.labRecallValue=(L?'أُغلقت الحلقة: الحقن مصدود':'Loop closed: injection blocked'); completeLabStage(); }
  }
}

async function _buildTable(){ if(_crackTable) return; _crackTable={}; for(var i=0;i<CRACK_DICT.length;i++){ _crackTable[await _sha(CRACK_DICT[i])]=CRACK_DICT[i]; } }
async function runCrackLab(){
  var L=state.language==='ar';
  var out=document.getElementById('crk-out'), hEl=document.getElementById('crk-hash');
  try{
    await _buildTable();
    var pw=document.getElementById('crk-in').value;
    var salt = _crackSalt ? ('x7$'+Math.random().toString(36).slice(2,8)) : '';
    var stored = await _sha(salt+pw);
    hEl.textContent = (salt ? ('salt='+salt+' · ') : '') + 'SHA256 = '+stored.slice(0,48)+'…';
    // الكسر: طابِق قيمة الاختزال المخزَّنة بجدول البحث (المبنيّ من الكلمات الشائعة بلا ملح)
    var cracked=_crackTable[stored];
    if(cracked){
      out.innerHTML='<div class="concept-box cb-fail"><div class="concept-box-title">'+(L?'🔴 كُسِرت فوراً!':'🔴 Cracked instantly!')+'</div><div class="concept-box-body">'

            :('The hash was found in the lookup table ← password: "'+cracked+'". Unsalted hashes of common passwords fall to a precomputed (rainbow) table.'))
        +'</div></div>';
      lessonState.labRecallValue=(L?'كُسِرت التجزئة غير المملَّحة: ':'Unsalted hash cracked: ')+cracked; completeLabStage();
    } else {
      var reason = _crackSalt
        ? (L?'🧂 التمليح أبطل الجدول: إضافة ملحٍ عشوائيّ قبل الاختزال غيّرت الناتج كلّه، فلم تعُد قيمة الاختزال المخزَّنة تطابق أيّ مدخلٍ في الجدول المسبق. الحمولة نفسها فشلت — أُغلقت الحلقة.'
             :'🧂 Salting defeats the table: a random salt before hashing changes the whole output, so the stored hash no longer matches any precomputed table entry. The same attack failed — loop closed.')
        : (L?'لم تُوجَد في جدول البحث (ليست من الكلمات الشائعة). جرّب كلمةً شائعة لترى الكسر الفوريّ.'
             :'Not found in the lookup table (not a common word). Try a common word to see the instant crack.');
      out.innerHTML='<div class="concept-box '+(_crackSalt?'cb':'')+'"><div class="concept-box-body">'+reason+'</div></div>';
      if(_crackSalt){ lessonState.labRecallValue=(L?'أُغلقت الحلقة: التمليح صدّ جدول البحث':'Loop closed: salting blocks the lookup table'); completeLabStage(); }
    }
  }catch(e){ out.innerHTML='<div class="lab-output error">'+(L?'خطأ: ':'Error: ')+e.message+'</div>'; }
}

  +'<div style="margin-top:14px"><div class="lab-label">👁️ '+(L?'ما يراه المتنصّت (Wireshark)':"Eavesdropper's view (Wireshark)")+'</div><div class="lab-output" id="tls-cap" dir="ltr">…</div></div>'
  +'<div id="tls-out" style="margin-top:10px"></div></div>';
