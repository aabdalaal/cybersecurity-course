async function tlsSend(){
  var L=state.language==='ar';
  var pw=document.getElementById('tls-in').value;
  var cap=document.getElementById('tls-cap'), out=document.getElementById('tls-out');
  if(!_tlsOn){
    cap.classList.remove('error');
    cap.textContent='POST /login  user=admin  pass='+pw+'   ['+(L?'نصّ عادي':'cleartext')+']';
    out.innerHTML='<div class="concept-box cb-fail"><div class="concept-box-title">'+(L?'🔴 تسريب السرّية':'🔴 Confidentiality breach')+'</div><div class="concept-box-body">'+(L?'القناة عادية (HTTP)، فالتقط المتنصّت كلمة المرور نصّاً واضحاً فوراً.':'The channel is plain (HTTP), so the eavesdropper captured the password in clear text instantly.')+'</div></div>';
    lessonState.labRecallValue=(L?'اعتراض ناجح على قناةٍ عادية':'Successful interception on a plain channel');
    completeLabStage();
  } else {
    var buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw+'tls-session'));
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    cap.textContent='Application Data (TLS 1.3)  '+hex.slice(0,56)+'…   ['+(L?'مشفَّر':'encrypted')+']';
    out.innerHTML='<div class="concept-box cb"><div class="concept-box-title">'+(L?'🔒 فشل الاعتراض':'🔒 Interception failed')+'</div><div class="concept-box-body">'+(L?'مع TLS صار المتنصّت يرى نصّاً مشفَّراً لا معنى له — حُميت السرّية حتى على شبكةٍ معادية. أُغلقت الحلقة.':'With TLS the eavesdropper sees meaningless ciphertext — confidentiality is protected even on a hostile network. Loop closed.')+'</div></div>';
    lessonState.labRecallValue=(L?'أُغلقت الحلقة: TLS يُبطِل الاعتراض':'Loop closed: TLS defeats interception');
    completeLabStage();
  }
}

al using '../'", "ok": true}, {"ar": "إعادة ضبط eth0 لعنوانٍ جديد", "en": "Reset eth0 for a new IP", "ok": false}, {"ar": "قوة غاشمة على SSH بالمنفذ 22", "en": "Brute-force SSH on port 22", "ok": false}], "why_ar": "تسلسل '../' يصعد إلى المجلّدات الأعلى.", "why_en": "The '../' sequence climbs to higher directories (directory traversal)."}], "0": [{"q_ar": "يعترض مهاجمٌ رسالة بريدٍ سرّيةً أثناء نقلها ويقرؤها دون تعديلها. أيّ هدفٍ أمنيٍّ انتُهك أساساً؟", "q_en": "An attacker intercepts and reads confidential email in transit but does not alter it. Which security objective is primarily violated?", "opts": [{"ar": "التوافر (Availability)", "en": "Availability", "ok": false}, {"ar": "السلامة (Integrity)", "en": "Integrity", "ok": false}, {"ar": "السرّية (Confidentiality)", "en": "Confidentiality", "ok": true}, {"ar": "عدم الإنكار (Non-repudiation)", "en": "Non-repudiation", "ok": false}], "why_ar": "الاعتراض والقراءة دون تعديل مساسٌ بالسريّة (Confidentiality)، وهو هجومٌ سلبي؛ تدبيره المضادّ التشفير (TLS/HTTPS).", "why_en": "Intercepting and reading without altering violates confidentiality — a passive attack; its countermeasure is encryption (TLS/HTTPS)."}, {"q_ar": "في اختراق مستشفًى، خادم Windows 7 غير المُرقَّع يوصَف على الأصحّ بأنّه:", "q_en": "In a hospital breach, an unpatched Windows 7 server is BEST described as a:", "opts": [{"ar": "تهديد (Threat)", "en": "Threat", "ok": false}, {"ar": "ثغرة (Vulnerability)", "en": "Vulnerability", "ok": true}, {"ar": "تدبير مضادّ (Control)", "en": "Control", "ok": false}, {"ar": "خطر (Risk)", "en": "Risk", "ok": false}], "why_ar": "النظام القديم غير المُرقَّع ضعفٌ داخليٌّ قابلٌ للاستغلال ⇒ ثغرة (Vulnerability). التهديد هو الفاعل الخارجي، والخطر هو الأثر × الاحتمال.", "why_en": "An unpatched legacy system is an internal exploitable weakness ⇒ a vulnerability. The threat is the external actor; risk is impact × likelihood."}, {"q_ar": "أيّ آليةٍ توفّر عدم الإنكار (Non-repudiation) أساساً؟", "q_en": "Which mechanism PRIMARILY provides non-repudiation?", "opts": [{"ar": "التشفير المتناظر (Symmetric encryption)", "en": "Symmetric encryption", "ok": false}, {"ar": "موازنة الحِمل (Load balancing)", "en": "Load balancing", "ok": false}, {"ar": "التوقيع الرقميّ (Digital signature)", "en": "Digital signature", "ok": true}, {"ar": "ترشيح الحزم (Packet filtering)", "en": "Packet filtering", "ok": false}], "why_ar": "التوقيع الرقمي يمنع الطرف من إنكار فعله ⇒ عدم الإنكار (Non-repudiation)، ويُعزَّز بسجلّات التدقيق (Audit Logs).", "why_en": "A digital signature stops a party from denying their action ⇒ non-repudiation, reinforced by audit logs."}, {"q_ar": "في إدارة الثغرات، يوفّر CVE ____ بينما يوفّر CVSS ____.", "q_en": "In vulnerability management, CVE provides ____ while CVSS provides ____.", "opts": [{"ar": "درجة خطورة / معرّفاً فريداً", "en": "a severity score / a unique identifier", "ok": false}, {"ar": "معرّفاً فريداً / درجة خطورة", "en": "a unique identifier / a severity score", "ok": true}, {"ar": "استغلالاً / رقعة", "en": "an exploit / a patch", "ok": false}, {"ar": "قاعدة جدار حماية / سجلّ تدقيق", "en": "a firewall rule / an audit log", "ok": false}], "why_ar": "CVE معرّفٌ فريدٌ موحّد للثغرة (مثل CVE-2021-44228)، وCVSS مقياسٌ رقمي للخطورة من 0.0 إلى 10.0. مثال Log4Shell حصل على 10.0 (حرجة).", "why_en": "CVE is a unique standard identifier for a vulnerability (e.g., CVE-2021-44228); CVSS is a numeric severity score 0.0–10.0. Log4Shell scored 10.0 (critical)."}, {"q_ar": "بحسب الوحدة، يُقارَب الخطر (Risk) على الأصحّ بأنّه:", "q_en": "According to the module, risk is BEST approximated as:", "opts": [{"ar": "تهديد + ثغرة", "en": "Threat + Vulnerability", "ok": false}, {"ar": "احتمال استغلال التهديد للثغرة × الأثر", "en": "Likelihood of a threat exploiting a vulnerability × impact", "ok": true}, {"ar": "عدد الضوابط ÷ عدد الأصول", "en": "Number of controls ÷ number of assets", "ok": false}, {"ar": "سطح الهجوم − الضوابط", "en": "Attack surface − controls", "ok": false}], "why_ar": "الخطر ≈ احتمال استغلال التهديد للثغرة × حجم الأثر؛ لذا يُخفَّض بخفض الاحتمال (ترقيع/توعية) أو الأثر (نسخ احتياطي معزول).", "why_en": "Risk ≈ likelihood of a threat exploiting a vulnerability × impact; lowered by reducing likelihood (patching/awareness) or impact (isolated backups)."}, {"q_ar": "أيٌّ ممّا يلي هجومٌ سلبيّ (Passive)؟", "q_en": "Which of the following is a PASSIVE attack?", "opts": [{"ar": "حقن SQL في صفحة دخول", "en": "SQL injection on a login page", "ok": false}, {"ar": "إغراق خادمٍ بهجوم DoS", "en": "DoS flooding of a server", "ok": false}, {"ar": "التنصّت بمحلّل حزم (sniffer)", "en": "Eavesdropping with a packet sniffer", "ok": true}, {"ar": "العبث بالبيانات أثناء النقل", "en": "Tampering with data in transit", "ok": false}], "why_ar": "التنصّت وتحليل الحزم مراقبةٌ دون تعديل ⇒ هجومٌ سلبي؛ أمّا الحقن والإغراق والعبث فهجماتٌ نشطة تتدخّل في البيانات أو الموارد.", "why_en": "Eavesdropping/sniffing observes without altering ⇒ a passive attack; injection, flooding and tampering are active attacks."}], "1": [{"q_ar": "في نموذج OSI، أيّ طبقةٍ تؤدّي العنونة المنطقية وتوجّه الحزم عبر الشبكات؟", "q_en": "In the OSI model, which layer performs logical addressing and routes packets across networks?", "opts": [{"ar": "وصلة البيانات (2)", "en": "Data Link (2)", "ok": false}, {"ar": "النقل (4)", "en": "Transport (4)", "ok": false}, {"ar": "الشبكة (3)", "en": "Network (3)", "ok": true}, {"ar": "الجلسة (5)", "en": "Session (5)", "ok": false}], "why_ar": "طبقة الشبكة (3) مسؤولةٌ عن العنونة المنطقية العالمية (عناوين IP) وتوجيه الحزم (Routing) عبر الشبكات الواسعة.", "why_en": "The Network layer (3) handles global logical addressing (IP) and routes packets across wide networks."}, {"q_ar": "أيّ بروتوكول نقلٍ موجّهٌ بالاتصال ويضمن تسليماً مرتّباً موثوقاً؟", "q_en": "Which transport protocol is connection-oriented and guarantees ordered, reliable delivery?", "opts": [{"ar": "UDP", "en": "UDP", "ok": false}, {"ar": "TCP", "en": "TCP", "ok": true}, {"ar": "ARP", "en": "ARP", "ok": false}, {"ar": "DHCP", "en": "DHCP", "ok": false}], "why_ar": "TCP موجّهٌ بالاتصال: يرقّم القطع وينتظر الإقرار ويعيد إرسال المفقود ويعيد ترتيب المختلط؛ بخلاف UDP عديم الاتصال.", "why_en": "TCP is connection-oriented: it sequences segments, waits for acknowledgements, retransmits losses and reorders — unlike connectionless UDP."}, {"q_ar": "أيّ سجلّ DNS يربط اسم النطاق بعنوان IPv4؟", "q_en": "Which DNS record maps a domain name to an IPv4 address?", "opts": [{"ar": "MX", "en": "MX", "ok": false}, {"ar": "NS", "en": "NS", "ok": false}, {"ar": "A", "en": "A", "ok": true}, {"ar": "CNAME", "en": "CNAME", "ok": false}], "why_ar": "سجلّ A يربط اسم النطاق بعنوان IPv4؛ أمّا MX فيدلّ على خادم البريد، وNS يعيّن خادم الأسماء الموثوق.", "why_en": "An A record maps a domain name to an IPv4 address; MX points to the mail server and NS designates the authoritative name server."}, {"q_ar": "ما الترتيب الصحيح للمصافحة الثلاثية لـ TCP؟", "q_en": "What is the correct order of the TCP three-way handshake?", "opts": [{"ar": "ACK → SYN → SYN-ACK", "en": "ACK → SYN → SYN-ACK", "ok": false}, {"ar": "SYN → SYN-ACK → ACK", "en": "SYN → SYN-ACK → ACK", "ok": true}, {"ar": "SYN → ACK → FIN", "en": "SYN → ACK → FIN", "ok": false}, {"ar": "SYN-ACK → SYN → ACK", "en": "SYN-ACK → SYN → ACK", "ok": false}], "why_ar": "المصافحة الثلاثية: العميل يرسل SYN، فيردّ الخادم بـSYN-ACK، فيقرّ العميل بـACK؛ ثمّ يُفتح الاتصال ويبدأ نقل البيانات.", "why_en": "The three-way handshake: the client sends SYN, the server replies SYN-ACK, the client acknowledges with ACK; then the connection opens."}, {"q_ar": "في TCP/IP، تقابل طبقةُ التطبيق أيّ طبقات OSI؟", "q_en": "In TCP/IP, the Application layer corresponds to which OSI layers?", "opts": [{"ar": "النقل فقط (4)", "en": "Transport only (4)", "ok": false}, {"ar": "التطبيق والتقديم والجلسة (7-6-5)", "en": "Application, Presentation, Session (7-6-5)", "ok": true}, {"ar": "الشبكة ووصلة البيانات (3-2)", "en": "Network and Data Link (3-2)", "ok": false}, {"ar": "الفيزيائية فقط (1)", "en": "Physical only (1)", "ok": false}], "why_ar": "تدمج طبقة التطبيق في TCP/IP طبقات OSI الثلاث العليا: التطبيق والتقديم والجلسة (7-6-5).", "why_en": "TCP/IP's Application layer merges OSI's top three: Application, Presentation, Session (7-6-5)."}, {"q_ar": "أثناء التغليف (Encapsulation)، ماذا تضيف طبقةُ وصلة البيانات إلى الحزمة؟", "q_en": "During encapsulation, what does the Data Link layer add to the packet?", "opts": [{"ar": "ترويسة IP بعنواني المصدر والوجهة", "en": "An IP header with source/destination IP", "ok": false}, {"ar": "ترويسة TCP بأرقام المنافذ", "en": "A TCP header with port numbers", "ok": false}, {"ar": "ترويسة MAC وتذييل تحقّقٍ من الأخطاء (FCS)", "en": "A MAC header and an error-check trailer (FCS)", "ok": true}, {"ar": "سجلّ DNS", "en": "A DNS record", "ok": false}], "why_ar": "عند التغليف تضيف طبقة الوصلة ترويسة MAC للتسليم المحلي وتذييل تحقّقٍ من الأخطاء (FCS)، فتصير الوحدة إطاراً (Frame).", "why_en": "During encapsulation the Data Link layer adds a MAC header for local delivery and an error-check trailer (FCS), forming a frame."}], "4": [{"q_ar": "في نمط (CBC)، ماذا يُخلَط بكلّ كتلةٍ من النصّ العادي قبل تعميتها؟", "q_en": "In CBC mode, what is combined with each plaintext block before encryption?", "opts": [{"ar": "مفتاح التعمية مباشرةً", "en": "The encryption key directly", "ok": false}, {"ar": "كتلة النصّ المشفَّر السابقة (عبر XOR)", "en": "The previous ciphertext block (via XOR)", "ok": true}, {"ar": "ثابتٌ محدَّد", "en": "A fixed constant", "ok": false}, {"ar": "النصّ العادي للكتلة التالية", "en": "The plaintext of the next block", "ok": false}], "why_ar": "في نمط CBC تُخلَط كلّ كتلةٍ بالنصّ المشفَّر للكتلة السابقة عبر XOR قبل تعميتها، فيبدأ التسلسل بمتّجه تهيئة IV — وهذا ما يُخفي أنماط الأصل.", "why_en": "In CBC each block is XORed with the previous ciphertext block before encryption, starting from an IV — which hides the plaintext patterns."}, {"q_ar": "لماذا يلزم متّجه تهيئةٍ (IV) عشوائيّ في نمط (CBC)؟", "q_en": "Why is a random Initialization Vector (IV) required in CBC mode?", "opts": [{"ar": "لتسريع التعمية", "en": "To speed up encryption", "ok": false}, {"ar": "لضمان أنّ النصوص المتطابقة تُنتج نصوصاً مشفَّرةً مختلفة", "en": "To ensure identical plaintexts produce different ciphertexts", "ok": true}, {"ar": "لتقصير المفتاح", "en": "To shorten the key", "ok": false}, {"ar": "لاستبدال المفتاح", "en": "To replace the key", "ok": false}], "why_ar": "متّجه التهيئة العشوائيّ يضمن أنّ الرسالة نفسها تُنتج نصّاً مشفَّراً مختلفاً في كلّ مرّة، فيمنع كشف تكرار الرسائل.", "why_en": "A random IV ensures the same message produces different ciphertext each time, preventing message-repetition leakage."}, {"q_ar": "يطبّق (3DES) خوارزمية DES ثلاث مرّاتٍ بأيّ تسلسل؟", "q_en": "3DES applies DES three times in which sequence?", "opts": [{"ar": "تعمية-تعمية-تعمية", "en": "Encrypt–Encrypt–Encrypt", "ok": false}, {"ar": "فكّ-تعمية-فكّ", "en": "Decrypt–Encrypt–Decrypt", "ok": false}, {"ar": "تعمية-فكّ-تعمية (EDE)", "en": "Encrypt–Decrypt–Encrypt", "ok": true}, {"ar": "فكّ-فكّ-فكّ", "en": "Decrypt–Decrypt–Decrypt", "ok": false}], "why_ar": "يطبّق 3DES نمط تعمية-فكّ-تعمية (EDE) بثلاثة مفاتيح؛ ووضع الفكّ في الوسط يجعله متوافقاً مع DES المفرد حين تتساوى المفاتيح.", "why_en": "3DES uses Encrypt–Decrypt–Encrypt (EDE) with three keys; the middle decrypt makes it compatible with single DES when the keys are equal."}, {"q_ar": "يُنشَأ التوقيع الرقميّ باستعمال أيّ مفتاح؟", "q_en": "A digital signature is created using which key?", "opts": [{"ar": "المفتاح العام للمرسِل", "en": "The sender's public key", "ok": false}, {"ar": "المفتاح الخاصّ للمرسِل", "en": "The sender's private key", "ok": true}, {"ar": "المفتاح العام للمستقبِل", "en": "The receiver's public key", "ok": false}, {"ar": "مفتاح متناظر مشترك", "en": "A shared symmetric key", "ok": false}], "why_ar": "يُوقَّع بالمفتاح الخاصّ للمرسِل ويُتحقَّق بمفتاحه العام؛ فلا ينتج توقيعاً صحيحاً إلا صاحب المفتاح الخاصّ — وهذا يوفّر المصادقة وعدم الإنكار.", "why_en": "It is signed with the sender's private key and verified with their public key; only the private-key holder can produce a valid signature — giving authentication and non-repudiation."}, {"q_ar": "ما المشكلة التي يحلّها بروتوكول (Diffie–Hellman) أساساً؟", "q_en": "What problem does the Diffie–Hellman protocol primarily solve?", "opts": [{"ar": "اختزال الملفّات الكبيرة", "en": "Hashing large files", "ok": false}, {"ar": "تبادل مفتاحٍ سرّيٍّ مشترك عبر قناةٍ غير آمنة", "en": "Exchanging a shared secret key over an insecure channel", "ok": true}, {"ar": "ضغط النصّ المشفَّر", "en": "Compressing ciphertext", "ok": false}, {"ar": "توقيع الشهادات", "en": "Signing certificates", "ok": false}], "why_ar": "يتيح Diffie–Hellman للطرفين الاتّفاق على مفتاحٍ سرّيٍّ مشترك عبر قناةٍ عامّة دون إرساله، فيحلّ مشكلة توزيع المفتاح المتناظر.", "why_en": "Diffie–Hellman lets two parties agree on a shared secret key over a public channel without sending it, solving symmetric key distribution."}], "5": [{"q_ar": "في المصفوفة التكاملية، ما الذي يكسر السلسلة من التهديد إلى الأثر؟", "q_en": "In the integrative matrix, what breaks the chain from threat to impact?", "opts": [{"ar": "ثغرة جديدة", "en": "A new vulnerability", "ok": false}, {"ar": "تدبير مضادّ (Control)", "en": "A countermeasure (control)", "ok": true}, {"ar": "سطح هجومٍ أوسع", "en": "A larger attack surface", "ok": false}, {"ar": "مفتاح أضعف", "en": "A weaker key", "ok": false}], "why_ar": "المصفوفة التكاملية تتتبّع: تهديد ← طبقة ← أثر، ويكسر هذه السلسلة التدبير المضادّ (الضابط) الذي يقلّل الخطر.", "why_en": "The integrative matrix traces threat → layer → impact, and the chain is broken by a countermeasure (control) that reduces risk."}, {"q_ar": "أيّ زوجٍ يطابق التهديد بطبقته صحيحاً؟", "q_en": "Which pair correctly matches a threat to its layer?", "opts": [{"ar": "تسميم ARP — طبقة التطبيق", "en": "ARP poisoning — application layer", "ok": false}, {"ar": "حقن SQL — طبقة الشبكة", "en": "SQL injection — network layer", "ok": false}, {"ar": "إغراق SYN — طبقة النقل", "en": "SYN flood — transport layer", "ok": true}, {"ar": "XSS — الطبقة الفيزيائية", "en": "XSS — physical layer", "ok": false}], "why_ar": "إغراق SYN يستغلّ المصافحة الثلاثية في طبقة النقل (TCP). أمّا تسميم ARP فطبقة شبكة، وحقن SQL وXSS في طبقة التطبيق.", "why_en": "A SYN flood abuses the TCP three-way handshake at the transport layer; ARP poisoning is network layer, and SQLi and XSS are application layer."}, {"q_ar": "هدف ثالوث CIA الأكثر تأثّراً مباشرةً بهجوم (DoS) هو:", "q_en": "The CIA triad goal most directly threatened by a DoS attack is:", "opts": [{"ar": "السرّية", "en": "Confidentiality", "ok": false}, {"ar": "السلامة", "en": "Integrity", "ok": false}, {"ar": "التوافر", "en": "Availability", "ok": true}, {"ar": "عدم الإنكار", "en": "Non-repudiation", "ok": false}], "why_ar": "هجوم حجب الخدمة يمنع الوصول إلى الخدمة، فيمسّ التوافر مباشرةً — أحد أضلاع ثالوث CIA.", "why_en": "A denial-of-service attack blocks access to the service, directly affecting availability — one vertex of the CIA triad."}, {"q_ar": "التشفير أثناء النقل (مثل TLS) يحمي أيّ هدفٍ من CIA أساساً ضدّ متنصّتٍ سلبيّ؟", "q_en": "Encryption in transit (e.g., TLS) primarily protects which CIA goal against a passive eavesdropper?", "opts": [{"ar": "التوافر", "en": "Availability", "ok": false}, {"ar": "السرّية", "en": "Confidentiality", "ok": true}, {"ar": "عدم الإنكار", "en": "Non-repudiation", "ok": false}, {"ar": "قابلية التكرار", "en": "Reproducibility", "ok": false}], "why_ar": "التشفير أثناء النقل يمنع المتنصّت السلبيّ من قراءة البيانات، فيصون السرّية أساساً (ويسهم في السلامة عبر آليات الاستيثاق).", "why_en": "Encryption in transit prevents a passive eavesdropper from reading the data, chiefly protecting confidentiality (and aiding integrity via authentication)."}, {"q_ar": "أيّ مبدأٍ ينصّ على أنّ الأمن يجب ألّا يعتمد على كتمان الخوارزمية؟", "q_en": "Which principle states that security must NOT depend on the secrecy of the algorithm?", "opts": [{"ar": "أقلّ امتياز", "en": "Least privilege", "ok": false}, {"ar": "مبدأ كيرشوف (Kerckhoffs)", "en": "Kerckhoffs's principle", "ok": true}, {"ar": "الدفاع في العمق", "en": "Defence in depth", "ok": false}, {"ar": "الفصل بين الواجبات", "en": "Separation of duties", "ok": false}], "why_ar": "مبدأ كيرشوف: الأمن في المفتاح لا في كتمان الخوارزمية؛ فالنظام يبقى آمناً ولو عُرفت خوارزميّته ما دام المفتاح سرّياً.", "why_en": "Kerckhoffs's principle: security lies in the key, not in hiding the algorithm; the system stays secure even if the algorithm is known, as long as the key is secret."}], "8": [{"q_ar": "أثناء مصافحة (TLS)، يُستعمَل التشفير غير المتناظر أساساً لـ:", "q_en": "During a TLS handshake, asymmetric cryptography is used mainly to:", "opts": [{"ar": "تعمية كلّ بيانات التطبيق", "en": "Encrypt all application data", "ok": false}, {"ar": "تأسيس مفتاح جلسةٍ مشتركٍ بأمان", "en": "Securely establish a shared session key", "ok": true}, {"ar": "ضغط الحركة", "en": "Compress the traffic", "ok": false}, {"ar": "تخزين الشهادات", "en": "Store certificates", "ok": false}], "why_ar": "يُستعمَل التشفير غير المتناظر في المصافحة لتبادل مفتاح جلسةٍ متناظرٍ بأمان، ثمّ تُعمّى البيانات بالمتناظر الأسرع.", "why_en": "In the handshake, asymmetric cryptography securely establishes a shared session key; the faster symmetric cipher then encrypts the data."}, {"q_ar": "في أيّ طبقةٍ يوفّر (IPsec) الأمن؟", "q_en": "At which layer does IPsec provide security?", "opts": [{"ar": "طبقة التطبيق", "en": "Application layer", "ok": false}, {"ar": "طبقة النقل", "en": "Transport layer", "ok": false}, {"ar": "طبقة الشبكة", "en": "Network layer", "ok": true}, {"ar": "الطبقة الفيزيائية", "en": "Physical layer", "ok": false}], "why_ar": "يعمل IPsec في طبقة الشبكة فيؤمّن حزم IP (عبر أنفاق VPN مثلاً)، بخلاف TLS الذي يؤمّن طبقة النقل/التطبيق.", "why_en": "IPsec operates at the network layer, securing IP packets (e.g., over VPN tunnels), unlike TLS which secures transport/application."}, {"q_ar": "ما دور سلطة التصديق (CA) في البنية التحتية للمفاتيح (PKI)؟", "q_en": "What is the role of a Certificate Authority (CA) in PKI?", "opts": [{"ar": "توليد مفاتيح متناظرة", "en": "To generate symmetric keys", "ok": false}, {"ar": "ضمان ارتباط الهويّة بمفتاحها العام", "en": "To vouch for the binding between an identity and its public key", "ok": true}, {"ar": "تعمية كلّ الرسائل", "en": "To encrypt all messages", "ok": false}, {"ar": "تخزين المفاتيح الخاصّة للمستخدمين", "en": "To store private keys of users", "ok": false}], "why_ar": "سلطة التصديق توقّع الشهادات فتضمن ارتباط الهويّة بمفتاحها العام؛ وهي أساس الثقة في البنية التحتية للمفاتيح PKI.", "why_en": "A Certificate Authority signs certificates, vouching that an identity is bound to its public key — the basis of trust in PKI."}, {"q_ar": "لماذا يقرأ المهاجم السلبيّ بيانات الاعتماد عبر HTTP العاديّ لا عبر HTTPS؟", "q_en": "Why can a passive attacker read credentials sent over plain HTTP but not HTTPS?", "opts": [{"ar": "HTTP يستعمل مفتاحاً أطول", "en": "HTTP uses a longer key", "ok": false}, {"ar": "HTTPS يعمّي القناة بـ TLS", "en": "HTTPS encrypts the channel with TLS", "ok": true}, {"ar": "HTTP يضغط البيانات", "en": "HTTP compresses data", "ok": false}, {"ar": "HTTPS يخفي عنوان IP", "en": "HTTPS hides the IP address", "ok": false}], "why_ar": "HTTPS يغلّف الحركة بـ TLS فتُعمّى البيانات؛ أمّا HTTP فيرسلها نصّاً عادياً يلتقطه المتنصّت (كما في مختبر Wireshark/DVWA).", "why_en": "HTTPS wraps traffic in TLS so the data is encrypted; plain HTTP sends it in cleartext that a sniffer captures (as in the Wireshark/DVWA lab)."}, {"q_ar": "أيّ خدمةٍ توفّرها الشهادة الرقمية أساساً في الاتصال الآمن؟", "q_en": "Which service does a digital certificate primarily enable in secure communication?", "opts": [{"ar": "توجيهٌ أسرع", "en": "Faster routing", "ok": false}, {"ar": "مصادقة هويّة الخادم", "en": "Authentication of the server's identity", "ok": true}, {"ar": "ضغط البيانات", "en": "Data compression", "ok": false}, {"ar": "موازنة الحِمل", "en": "Load balancing", "ok": false}], "why_ar": "الشهادة الرقمية تُثبت هويّة الخادم للعميل قبل تعمية الجلسة، فتمنع انتحال الخوادم في هجمات الوسيط.", "why_en": "A digital certificate proves the server's identity to the client before the session is encrypted, preventing server impersonation in MITM attacks."}], "10": [{"q_ar": "الفرق الجوهريّ بين IDS و IPS أنّ IPS:", "q_en": "The key difference between an IDS and an IPS is that an IPS:", "opts": [{"ar": "يسجّل الحركة فقط", "en": "Only logs traffic", "ok": false}, {"ar": "يكشف ويحجب الهجوم فعليّاً في مساره", "en": "Detects and actively blocks the attack inline", "ok": true}, {"ar": "أبطأ بالتصميم", "en": "Runs slower by design", "ok": false}, {"ar": "لا يكشف الهجمات", "en": "Cannot detect attacks", "ok": false}], "why_ar": "IDS يكشف ويُنبّه فقط، بينما IPS يقع في مسار الحركة فيكشف ويحجب الهجوم آنياً.", "why_en": "An IDS only detects and alerts, while an IPS sits inline and detects and blocks the attack in real time."}, {"q_ar": "توصَف مصيدة العسل (Honeypot) على الأصحّ بأنّها:", "q_en": "A honeypot is best described as:", "opts": [{"ar": "خادم إنتاجٍ مُحصَّن", "en": "A hardened production server", "ok": false}, {"ar": "نظامٌ طُعمٌ يُغري المهاجمين ويدرسهم", "en": "A decoy system that lures and studies attackers", "ok": true}, {"ar": "نوعٌ من قواعد جدار الحماية", "en": "A type of firewall rule", "ok": false}, {"ar": "خوارزمية تعمية", "en": "An encryption algorithm", "ok": false}], "why_ar": "مصيدة العسل نظامٌ طُعمٌ يُغري المهاجم لدراسة أساليبه وصرفه عن الأصول الحقيقية.", "why_en": "A honeypot is a decoy system that lures attackers to study their methods and divert them from real assets."}, {"q_ar": "«الدفاع في العمق» يعني:", "q_en": "'Defence in depth' means:", "opts": [{"ar": "الاعتماد على ضابطٍ قويٍّ واحد", "en": "Relying on one strong control", "ok": false}, {"ar": "رصّ ضوابط متعدّدة تعوّض كلٌّ منها ثغرات الأخرى", "en": "Layering multiple controls so each compensates for others' gaps", "ok": true}, {"ar": "تعمية كلّ شيءٍ مرّتين", "en": "Encrypting everything twice", "ok": false}, {"ar": "حجب كلّ الحركة افتراضياً", "en": "Blocking all traffic by default", "ok": false}], "why_ar": "الدفاع في العمق يرصّ طبقاتٍ متعدّدة من الضوابط بحيث تعوّض كلٌّ منها ثغرة ما قبلها — فلا نقطة فشلٍ واحدة.", "why_en": "Defence in depth stacks multiple controls so each compensates for others' gaps — no single point of failure."}, {"q_ar": "سياسة الرفض الافتراضيّ (default-deny) في جدار الحماية تعني:", "q_en": "A default-deny firewall policy means:", "opts": [{"ar": "السماح بكلّ الحركة إلا المحجوب صراحةً", "en": "All traffic is allowed unless explicitly blocked", "ok": false}, {"ar": "حجب كلّ الحركة إلا المسموح صراحةً", "en": "All traffic is blocked unless explicitly allowed", "ok": true}, {"ar": "ترشيح الحركة الصادرة فقط", "en": "Only outbound traffic is filtered", "ok": false}, {"ar": "تعطيل التسجيل", "en": "Logging is disabled", "ok": false}], "why_ar": "سياسة الرفض الافتراضيّ تحجب كلّ حركةٍ إلا ما يُسمَح به صراحةً، وهي أكثر أماناً من السماح الافتراضيّ.", "why_en": "A default-deny policy blocks all traffic except what is explicitly allowed, which is safer than default-allow."}, {"q_ar": "IDS القائم على التواقيع (signature-based) محدودٌ لأنّه:", "q_en": "A signature-based IDS is limited because it:", "opts": [{"ar": "لا يكشف الهجمات المعروفة", "en": "Cannot detect known attacks", "ok": false}, {"ar": "يصعب عليه كشف الهجمات الجديدة (zero-day) غير المسجّلة", "en": "Struggles to detect novel (zero-day) attacks not in its database", "ok": true}, {"ar": "يحجب كلّ الحركة", "en": "Blocks all traffic", "ok": false}, {"ar": "لا يحتاج تحديثاً", "en": "Requires no updates", "ok": false}], "why_ar": "الكشف القائم على التواقيع يطابق أنماطاً معروفة، فيعجز عن الهجمات الجديدة (zero-day) غير المسجّلة — ولذا يُكمَّل بالكشف السلوكيّ.", "why_en": "Signature-based detection matches known patterns, so it misses novel (zero-day) attacks not in its database — hence complemented by behavioural detection."}]};
/* مفاتيح ترجمة إضافية للاختبار المتعدّد */
Object.assign(I18N.ar,{q_of:"سؤال",q_next:"السؤال التالي ←",q_finish:"إنهاء الاختبار",q_score:"نتيجتك",q_pass:"✅ اجتزت الاختبار!",q_retry:"↻ أعد المحاولة",q_banknote:"سؤال امتحانٍ من البنك (بالإنجليزية)"});
Object.assign(I18N.en,{q_of:"Question",q_next:"Next question →",q_finish:"Finish quiz",q_score:"Your score",q_pass:"✅ You passed!",q_retry:"↻ Retry",q_banknote:"Exam-bank question (English)"});

/* يبني مجموعة أسئلة الوحدة: السؤال المؤلَّف (ثنائيّ اللغة) + أسئلة البنك (امتحانية إنجليزية) */
function buildQuizSet(m){
  var set=[];
  var aq=LF(m,'quiz');
  set.push({q:aq.q, opts:aq.opts.slice(), why:aq.why, bank:false});
  var bq=BANK[m.id]||BANK[String(m.id)]||[];
  var L=state.language==='ar';
  bq.forEach(function(x){
    var opts=x.opts.map(function(o){ return {t:(L?o.ar:o.en), ok:o.ok}; });
    set.push({q:(L?x.q_ar:x.q_en), opts:opts, why:(L?x.why_ar:x.why_en), bank:false});
  });
  return set;
}
var _qset=[], _qidx=0, _qscore=0, _qmod=0;
function renderQuiz(m){
  _qmod=m.id; _qset=buildQuizSet(m); _qidx=0; _qscore=0;
  var rv=lessonState.labRecallValue; document.getElementById('quiz-recall').innerHTML = rv?(T('recall')+'<code>'+rv+'</code>'):'';
  document.getElementById('quiz-result').innerHTML='';
  renderQuizQuestion();
}
function renderQuizQuestion(){
  var it=_qset[_qidx];
  document.getElementById('quiz-counter').textContent = T('q_of')+' '+(_qidx+1)+' / '+_qset.length + (it.bank?('  ·  '+T('q_banknote')):'');
  var qEl=document.getElementById('m-quiz-q'); qEl.textContent=it.q;
  qEl.setAttribute('dir', it.bank?'ltr':(state.language==='ar'?'rtl':'ltr'));
  var opts=document.getElementById('quiz-opts');
  opts.innerHTML=it.opts.map(function(o){ return '<button class="quiz-opt" data-ok="'+o.ok+'" dir="'+(it.bank?'ltr':'auto')+'" onclick="answerQuizItem(this,'+o.ok+')">'+o.t+'</button>'; }).join('');
  document.getElementById('quiz-feedback').innerHTML='';
  document.getElementById('quiz-next').classList.add('hidden');
}
function answerQuizItem(btn, ok){
  document.querySelectorAll('.quiz-opt').forEach(function(b){ b.disabled=true; if(b.dataset.ok==='true') b.classList.add('correct'); });
  if(!ok) btn.classList.add('wrong');
  if(ok) _qscore++;
  document.getElementById('quiz-feedback').innerHTML=(ok?T('correct'):T('wrong'))+_qset[_qidx].why;
  var nb=document.getElementById('quiz-next');
  nb.textContent = (_qidx < _qset.length-1) ? T('q_next') : T('q_finish');
  nb.classList.remove('hidden');
}
function nextQuizQuestion(){
  if(_qidx < _qset.length-1){ _qidx++; renderQuizQuestion(); }
  else { showQuizResult(); }
}
function showQuizResult(){
  document.getElementById('quiz-counter').textContent='';
  document.getElementById('m-quiz-q').textContent='';
  document.getElementById('quiz-opts').innerHTML='';
  document.getElementById('quiz-feedback').innerHTML='';
  document.getElementById('quiz-next').classList.add('hidden');
  var total=_qset.length, pct=Math.round(_qscore/total*100), pass=pct>=60;
  var html='<div class="ucard" style="text-align:center;border-color:'+(pass?'var(--secondary)':'var(--danger)')+'">'
    +'<div style="font-size:34px;font-weight:800;color:'+(pass?'var(--secondary-d)':'var(--danger)')+'">'+_qscore+' / '+total+'</div>'
    +'<div class="l" style="margin:6px 0">'+T('q_score')+' · '+pct+'%</div>'
    +(pass?('<div style="font-weight:700;color:var(--secondary-d)">'+T('q_pass')+'</div>'):('<button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="renderQuiz(MODULES['+_qmod+'])">'+T('q_retry')+'</button>'))
    +'</div>';
  document.getElementById('quiz-result').innerHTML=html;
  if(pass && !state.done[_qmod]){ state.done[_qmod]=true; awardXP(10); showToast(T('unitdone')); }
}

/* ===== لغة/تصدير/استيراد ===== */
function toggleLang(){ state.language = state.language==='ar'?'en':'ar'; document.documentElement.dir = state.language==='ar'?'rtl':'ltr'; document.documentElement.lang=state.language; saveState(); applyI18n();
  if(!document.getElementById('view-module').classList.contains('hidden')) openModule(curMod); else navigate(currentScreen); }
function exportProgress(){ var blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:{state:state}},null,2)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cyber-security-course-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(a.href); showToast('✓'); }
function importProgress(input){ var f=input.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(e){ try{ var p=JSON.parse(e.target.result); if(!p.version||!p.data) throw new Error('invalid'); state=Object.assign(state,p.data.state||{}); saveState(); document.documentElement.dir=state.language==='ar'?'rtl':'ltr'; document.documentElement.lang=state.language; navigate('profile'); showToast('✓'); }catch(err){ showToast('✗ '+err.message); } input.value=''; }; r.readAsText(f); }

/* خزّن مخرجات المختبر في «أعمالي» وافتح الاختبار عند إتمام المختبر */
var _origCLS = completeLabStage;
completeLabStage = function(){
  _origCLS();
  var _nb=document.getElementById('lesson-next-btn'); if(_nb) _nb.textContent = state.language==='ar'?'✅ اكتمل المختبر — افتح الاختبار':'✅ Lab complete — open the quiz';
  if(lessonState.labRecallValue){ state.labOut[curMod]=lessonState.labRecallValue; }
  else if(MODULES[curMod] && MODULES[curMod].lab==='dread'){ state.labOut[curMod]=T('dread_note'); }
  else if(MODULES[curMod] && MODULES[curMod].lab==='brief'){ state.labOut[curMod]=T('done_prefix')+LF(MODULES[curMod],'brief').title; }
  saveState();
  var tq=document.getElementById('tab-quiz'); if(tq) tq.disabled=false;
  showToast(T('labdone'));
};

/* الإقلاع */
try{ var sv=JSON.parse(localStorage.getItem('csc_state')||'null'); if(sv) state=Object.assign(state,sv); }catch(e){}
document.documentElement.dir = state.language==='ar'?'rtl':'ltr'; document.documentElement.lang=state.language;
/* ===== موجِّه الرابط العميق (deep link): #u=<رقم الوحدة 1..11>&tab=concept|lab|quiz ===== */
function routeFromHash(){
  var h=(location.hash||'').replace(/^#/,'');
  if(!h){ applyI18n(); navigate('home'); return; }
  var p={}; h.split('&').forEach(function(kv){ var a=kv.split('='); p[a[0]]=a[1]; });
  var u=parseInt(p.u,10);
  if(u>=1 && u<=MODULES.length){
    applyI18n(); openModule(u-1);
    var tab=(p.tab==='lab'||p.tab==='quiz')?p.tab:'concept';
    if(tab==='quiz' && document.getElementById('tab-quiz').disabled) tab='concept';
    showStage(tab);
  } else { applyI18n(); navigate('home'); }
}
window.addEventListener('hashchange', routeFromHash);
routeFromHash();
</script>
