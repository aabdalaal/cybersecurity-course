<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20406f"/><stop offset="1" stop-color="#14243f"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe6f5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4C066"/><stop offset="1" stop-color="#C79A3A"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- subtle circuit dots -->
  <g stroke="#2E5496" stroke-width="6" opacity="0.35" stroke-linecap="round">
    <path d="M70 150 h58 v-40"/><circle cx="70" cy="150" r="8" fill="#2E5496" stroke="none"/>
    <path d="M442 360 h-58 v40"/><circle cx="442" cy="360" r="8" fill="#2E5496" stroke="none"/>
    <path d="M60 360 h40"/><circle cx="60" cy="360" r="8" fill="#2E5496" stroke="none"/>
    <path d="M452 150 h-40"/><circle cx="452" cy="150" r="8" fill="#2E5496" stroke="none"/>
  </g>
  <!-- shield -->
  <path d="M256 78 L400 128 V262 C400 350 336 410 256 440 C176 410 112 350 112 262 V128 Z"
        fill="url(#sh)" stroke="#2E5496" stroke-width="8"/>
  <!-- padlock -->
  <g transform="translate(256 262)">
    <path d="M-46 -30 a46 46 0 0 1 92 0 v34 h-26 v-34 a20 20 0 0 0 -40 0 v34 h-26 z" fill="#1F3864"/>
    <rect x="-64" y="0" width="128" height="104" rx="20" fill="#1F3864"/>
    <circle cx="0" cy="44" r="17" fill="url(#gold)"/>
    <rect x="-7" y="44" width="14" height="34" rx="7" fill="url(#gold)"/>
  </g>
</svg>
